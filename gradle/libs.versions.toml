# Gradle Version Catalog
# Centralized dependency management for easier updates
#
# Benefits:
# - Single source of truth for versions
# - Easier to update dependencies
# - Better IDE support
# - Type-safe accessors

[versions]
# Kotlin & Compose
 kotlin = "2.1.0"
  compose-bom = "2025.11.01"
 compose-compiler = "2.1.0"

# AndroidX Core
core-ktx = "1.17.0"
appcompat = "1.7.1"
lifecycle = "2.10.0"
activity-compose = "1.12.0"
navigation-compose = "2.9.6"

# Dependency Injection
 hilt = "2.53"
hilt-navigation = "1.3.0"

# Database & Storage
room = "2.8.4"
datastore = "1.2.0"

# Networking
retrofit = "3.0.0"
okhttp = "5.2.1"

# Media
 media3 = "1.8.0"
 media = "1.7.1"
 media3-midi = "1.8.0"

  # Tooling & utilities
  desugar = "2.1.5"
  retrofit-serialization = "1.0.0"
  jellyfin = "1.8.3"
  jcifs = "2.1.10"
  commons-compress = "1.28.0"
  xz = "1.10"
  kotlin-csv = "1.10.0"
  customactivityoncrash = "2.4.0"
  swipe = "1.3.0"
  taptargetcompose = "1.2.1"
 aboutlibraries = "13.1.0"
 zxing-android = "4.3.0"
 zxing-core = "3.5.3"
 mpandroidchart = "v3.1.0"
 ffmpeg-metadata = "1.0.19"
 mlkit-text-recognition = "16.0.1"
 coroutines = "1.10.1"
 ktmidi = "0.11.1"
 mockito = "5.20.0"
 mockito-kotlin = "5.4.0"
 arch-core-testing = "2.2.0"
 truth = "1.4.4"
 mockk = "1.14.6"
 robolectric = "4.14.1"
    
    # Document Parsing Libraries
    apache-poi = "5.5.0"
    apache-tika = "3.2.3"
    lib-mobi = "1.0.3"

# Readium Toolkit - Modern EPUB/PDF/Audiobook/OPDS library
# ⚠️ Check for updates: https://github.com/readium/kotlin-toolkit/releases
readium = "3.1.2"

# AI & ML
gemini = "0.9.0"
mcp-kotlin = "0.4.0"
ktor = "3.0.0"

# Other Libraries
 coil = "2.7.0"
 palette = "1.0.0"
serialization = "1.9.0"
glance = "1.1.1"
junrar = "7.5.7"
jsoup = "1.21.2"
security-crypto = "1.1.0"
biometric = "1.4.0-alpha04"
work = "2.11.0"
hilt-work = "1.2.0"
nanohttpd = "2.3.1"
cast = "22.2.0"

[libraries]
# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
 desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

# AndroidX Core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
