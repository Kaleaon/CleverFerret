<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>CleverFerret</title>
    
    <!-- Enhanced PWA Meta Tags -->
    <meta name="description" content="A comprehensive Progressive Web App for managing and organizing your personal library of books, movies, music, comics, podcasts, and more. Features AI-powered metadata enhancement, advanced file system integration, offline support, and cross-platform synchronization.">
    <meta name="keywords" content="media manager, book library, movie collection, music organizer, comic reader, podcast manager, PWA, offline, AI-powered">
    <meta name="author" content="CleverFerret Team">
    <meta name="robots" content="index, follow">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./public/manifest-enhanced.json" />
    
    <!-- Enhanced Favicon and Icons -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png" />
    <link rel="mask-icon" href="./icons/safari-pinned-tab.svg" color="#ffc300" />
    
    <!-- Mobile Optimizations -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CleverFerret" />
    
    <!-- Windows Tiles -->
    <meta name="msapplication-TileColor" content="#010919" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#ffc300" />
    <meta name="msapplication-navbutton-color" content="#ffc300" />
    
    <!-- Enhanced Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Enhanced CSS -->
    <link rel="stylesheet" href="./src/index-enhanced.css" />
    
    <!-- Preload Critical Resources -->
    <link rel="modulepreload" href="./src/App-Enhanced.tsx" />
    <link rel="modulepreload" href="./src/types-enhanced.ts" />
    
    <!-- SQL.js for Calibre Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js" defer></script>
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    
    <!-- Open Graph Meta Tags for Social Sharing -->
    <meta property="og:title" content="CleverFerret">
    <meta property="og:description" content="A comprehensive PWA for managing books, movies, music, and more with AI-powered features">
    <meta property="og:image" content="./icons/og-image.png">
    <meta property="og:url" content="https://cleverferret.app">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CleverFerret">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="CleverFerret">
    <meta name="twitter:description" content="A comprehensive PWA for managing books, movies, music, and more">
    <meta name="twitter:image" content="./icons/twitter-card.png">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CleverFerret",
      "description": "Universal Media Library PWA",
      "url": "https://cleverferret.app",
      "applicationCategory": "Productivity",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "CleverFerret Team"
      }
    }
    </script>
    
    <style>
        /* Critical CSS for faster initial render */
        body {
            margin: 0;
            padding: 0;
            background-color: #010919;
            color: #f1f5f9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow-x: hidden;
        }
        
        .loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #010919 0%, #1e293b 50%, #010919 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #ffc300, #00d4aa);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #010919;
            margin-bottom: 2rem;
            animation: pulse 2s infinite;
        }
        
        .loading-text {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffc300, #00d4aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .loading-subtitle {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }
        
        .loading-progress {
            width: 200px;
            height: 4px;
            background: rgba(255, 195, 0, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffc300, #00d4aa);
            width: 0%;
            animation: loadingProgress 3s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes loadingProgress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        /* Error State */
        .error-screen {
            position: fixed;
            inset: 0;
            background: #010919;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            padding: 2rem;
        }
        
        .error-icon {
            font-size: 4rem;
            color: #ef4444;
            margin-bottom: 1rem;
        }
        
        .error-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #f1f5f9;
        }
        
        .error-message {
            font-size: 1rem;
            color: #94a3b8;
            text-align: center;
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        
        .retry-button {
            background: linear-gradient(135deg, #ffc300, #00d4aa);
            color: #010919;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .retry-button:hover {
            transform: translateY(-2px);
        }
        
        /* Skip to content for accessibility */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 6px;
            background: #ffc300;
            color: #010919;
            padding: 8px;
            border-radius: 4px;
            text-decoration: none;
            z-index: 1000;
            transition: top 0.3s;
        }
        
        .skip-link:focus {
            top: 6px;
        }
    </style>
</head>
<body>
    <!-- Accessibility Skip Link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- Enhanced Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-logo">CF</div>
        <div class="loading-text">CleverFerret</div>
        <div class="loading-progress">
            <div class="loading-progress-bar"></div>
        </div>
    </div>
    
    <!-- Error Screen -->
    <div id="error-screen" class="error-screen">
        <div class="error-icon">⚠️</div>
        <div class="error-title">Something went wrong</div>
        <div class="error-message">
            We're having trouble loading CleverFerret. Please check your internet connection and try again.
        </div>
        <button class="retry-button" onclick="window.location.reload()">Retry</button>
    </div>
    
    <!-- Main App Container -->
    <div id="root" role="main" aria-label="CleverFerret application"></div>
    
    <!-- PWA Install Prompt -->
    <div id="pwa-install-prompt" style="display: none;">
        <div style="position: fixed; bottom: 20px; right: 20px; background: linear-gradient(135deg, #ffc300, #00d4aa); color: #010919; padding: 1rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 300px; z-index: 1000;">
            <div style="font-weight: 600; margin-bottom: 0.5rem;">📱 Install CleverFerret</div>
            <div style="font-size: 0.875rem; margin-bottom: 1rem; opacity: 0.9;">Add to your home screen for the best experience</div>
            <div style="display: flex; gap: 0.5rem;">
                <button id="install-pwa" style="flex: 1; background: rgba(1,9,25,0.2); color: inherit; border: 1px solid rgba(1,9,25,0.3); padding: 0.5rem; border-radius: 6px; cursor: pointer;">Install</button>
                <button id="dismiss-install" style="flex: 1; background: transparent; color: inherit; border: 1px solid rgba(1,9,25,0.3); padding: 0.5rem; border-radius: 6px; cursor: pointer;">Later</button>
            </div>
        </div>
    </div>
    
    <!-- Offline Indicator -->
    <div id="offline-indicator" style="position: fixed; top: 0; left: 0; right: 0; background: #ef4444; color: white; padding: 0.5rem; text-align: center; font-weight: 600; z-index: 1200; transform: translateY(-100%); transition: transform 0.3s;">
        📡 You're offline. Some features may be limited.
    </div>
    
    <!-- Enhanced App Initialization Script -->
    <script>
        // Global error handling
        window.addEventListener('error', (event) => {
            console.error('Global error:', event.error);
            showErrorScreen(event.error.message);
        });
        
        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled promise rejection:', event.reason);
            showErrorScreen('Failed to load application resources');
        });
        
        // Enhanced loading management
        let loadingTimeout;
        
        function showLoadingScreen() {
            const loading = document.getElementById('loading-screen');
            loading.classList.remove('hidden');
            
            // Auto-hide after 10 seconds if app doesn't load
            loadingTimeout = setTimeout(() => {
                showErrorScreen('Application took too long to load');
            }, 10000);
        }
        
        function hideLoadingScreen() {
            if (loadingTimeout) clearTimeout(loadingTimeout);
            const loading = document.getElementById('loading-screen');
            loading.classList.add('hidden');
            
            setTimeout(() => {
                loading.style.display = 'none';
            }, 500);
        }
        
        function showErrorScreen(message = '') {
            if (loadingTimeout) clearTimeout(loadingTimeout);
            
            const loading = document.getElementById('loading-screen');
            const error = document.getElementById('error-screen');
            const errorMessage = error.querySelector('.error-message');
            
            loading.style.display = 'none';
            error.style.display = 'flex';
            
            if (message) {
                errorMessage.textContent = message;
            }
        }
        
        // PWA Installation
        let deferredInstallPrompt = null;
        
        window.addEventListener('beforeinstallprompt', (event) => {
            event.preventDefault();
            deferredInstallPrompt = event;
            
            // Show install prompt after user has used the app
            setTimeout(() => {
                showInstallPrompt();
            }, 30000); // 30 seconds
        });
        
        function showInstallPrompt() {
            if (!deferredInstallPrompt) return;
            
            const prompt = document.getElementById('pwa-install-prompt');
            prompt.style.display = 'block';
            
            document.getElementById('install-pwa').onclick = async () => {
                if (deferredInstallPrompt) {
                    deferredInstallPrompt.prompt();
                    const result = await deferredInstallPrompt.userChoice;
                    console.log('PWA install prompt result:', result);
                    deferredInstallPrompt = null;
                }
                prompt.style.display = 'none';
            };
            
            document.getElementById('dismiss-install').onclick = () => {
                prompt.style.display = 'none';
            };
        }
        
        // Network status monitoring
        function updateOnlineStatus() {
            const indicator = document.getElementById('offline-indicator');
            
            if (!navigator.onLine) {
                indicator.style.transform = 'translateY(0)';
            } else {
                indicator.style.transform = 'translateY(-100%)';
            }
        }
        
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();
        
        // Service Worker Registration
        async function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register('./src/enhanced-sw.js', {
                        scope: './'
                    });
                    
                    console.log('Enhanced Service Worker registered successfully:', registration);
                    
                    // Listen for updates
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // New version available
                                showUpdatePrompt(registration);
                            }
                        });
                    });
                } catch (error) {
                    console.error('Service Worker registration failed:', error);
                }
            }
        }
        
        function showUpdatePrompt(registration) {
            const updatePrompt = document.createElement('div');
            updatePrompt.style.cssText = `
                position: fixed;
                bottom: 80px;
                right: 20px;
                background: linear-gradient(135deg, #ffc300, #00d4aa);
                color: #010919;
                padding: 1rem;
                border-radius: 12px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                max-width: 300px;
                z-index: 1000;
            `;
            
            updatePrompt.innerHTML = `
                <div style="font-weight: 600; margin-bottom: 0.5rem;">🔄 Update Available</div>
                <div style="font-size: 0.875rem; margin-bottom: 1rem; opacity: 0.9;">A new version of CleverFerret is ready</div>
                <div style="display: flex; gap: 0.5rem;">
                    <button id="update-app" style="flex: 1; background: rgba(1,9,25,0.2); color: inherit; border: 1px solid rgba(1,9,25,0.3); padding: 0.5rem; border-radius: 6px; cursor: pointer;">Update</button>
                    <button id="dismiss-update" style="flex: 1; background: transparent; color: inherit; border: 1px solid rgba(1,9,25,0.3); padding: 0.5rem; border-radius: 6px; cursor: pointer;">Later</button>
                </div>
            `;
            
            document.body.appendChild(updatePrompt);
            
            updatePrompt.querySelector('#update-app').onclick = () => {
                if (registration.waiting) {
                    registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                }
                window.location.reload();
            };
            
            updatePrompt.querySelector('#dismiss-update').onclick = () => {
                updatePrompt.remove();
            };
        }
        
        // Performance monitoring
        function initPerformanceMonitoring() {
            if ('PerformanceObserver' in window) {
                const observer = new PerformanceObserver((list) => {
                    for (const entry of list.getEntries()) {
                        if (entry.entryType === 'navigation') {
                            console.log('Navigation timing:', {
                                domContentLoaded: entry.domContentLoadedEventEnd - entry.domContentLoadedEventStart,
                                loadComplete: entry.loadEventEnd - entry.loadEventStart
                            });
                        }
                    }
                });
                
                observer.observe({ entryTypes: ['navigation', 'paint'] });
            }
        }
        
        // Analytics and crash reporting (placeholder)
        function initAnalytics() {
            // Initialize analytics service (e.g., Google Analytics, Mixpanel)
            console.log('Analytics initialized');
        }
        
        // Initialize everything
        async function initializeApp() {
            try {
                showLoadingScreen();
                
                await registerServiceWorker();
                initPerformanceMonitoring();
                initAnalytics();
                
                // Signal that the app can start loading
                window.appReady = true;
                
                console.log('Enhanced CleverFerret PWA initialized successfully');
            } catch (error) {
                console.error('App initialization failed:', error);
                showErrorScreen('Failed to initialize application');
            }
        }
        
        // Start initialization
        initializeApp();
        
        // Hide loading screen when React app mounts
        window.hideLoadingScreen = hideLoadingScreen;
    </script>
    
    <!-- Enhanced React App -->
    <script type="module">
        import React from 'react';
        import ReactDOM from 'react-dom/client';
        import EnhancedApp from './src/App-Enhanced.tsx';
        
        // Wait for app initialization
        function waitForAppReady() {
            return new Promise((resolve) => {
                const checkReady = () => {
                    if (window.appReady) {
                        resolve();
                    } else {
                        setTimeout(checkReady, 100);
                    }
                };
                checkReady();
            });
        }
        
        async function startApp() {
            try {
                await waitForAppReady();
                
                const root = ReactDOM.createRoot(document.getElementById('root'));
                
                root.render(
                    React.createElement(React.StrictMode, null,
                        React.createElement(EnhancedApp)
                    )
                );
                
                // Hide loading screen after React renders
                setTimeout(() => {
                    if (window.hideLoadingScreen) {
                        window.hideLoadingScreen();
                    }
                }, 1000);
                
                console.log('Enhanced CleverFerret app started successfully');
            } catch (error) {
                console.error('Failed to start app:', error);
                if (window.showErrorScreen) {
                    window.showErrorScreen('Failed to start application');
                }
            }
        }
        
        startApp();
    </script>
    
    <!-- Development Tools (only in development) -->
    <script>
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
            // Development-only features
            console.log('%c🚀 CleverFerret Enhanced PWA - Development Mode', 'color: #ffc300; font-size: 16px; font-weight: bold;');
            
            // Add development tools
            window.devTools = {
                clearCache: async () => {
                    if ('caches' in window) {
                        const cacheNames = await caches.keys();
                        await Promise.all(cacheNames.map(name => caches.delete(name)));
                        console.log('Cache cleared');
                    }
                },
                clearStorage: () => {
                    localStorage.clear();
                    sessionStorage.clear();
                    indexedDB.deleteDatabase('CleverFerretEnhancedDB');
                    console.log('Storage cleared');
                },
                showCacheInfo: async () => {
                    if ('caches' in window) {
                        const cacheNames = await caches.keys();
                        for (const name of cacheNames) {
                            const cache = await caches.open(name);
                            const requests = await cache.keys();
                            console.log(`Cache ${name}:`, requests.length, 'entries');
                        }
                    }
                }
            };
            
            console.log('Development tools available: devTools.clearCache(), devTools.clearStorage(), devTools.showCacheInfo()');
        }
    </script>
