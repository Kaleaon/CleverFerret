<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - CleverFerret</title>
    <meta name="theme-color" content="#6750A4" />
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: #0a1630;
        color: #e6eaf2;
      }
      .container {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: #0d1b36;
        border: 1px solid #1b2b4d;
        border-radius: 12px;
        padding: 24px;
        max-width: 520px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 8px;
        font-weight: 400;
      }
      p {
        opacity: 0.9;
      }
      .btn {
        display: inline-block;
        margin-top: 12px;
        background: #d4af37;
        color: #0a1630;
        padding: 10px 16px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>You're offline</h1>
        <p>
          CleverFerret can't reach the network right now. You can still browse previously opened
          pages and your downloaded content.
        </p>
        <a class="btn" href="/">Go Home</a>
      </div>
    </div>
  </body>
</html>
