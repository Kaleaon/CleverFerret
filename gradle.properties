# This property is required for any modern Android project using AndroidX.
android.useAndroidX=true

# This property is recommended for better build performance and correctness.
android.nonTransitiveRClass=true

# Suppress Kotlin version compatibility check for Compose
android.suppressKotlinVersionCompatibilityCheck=true

# Optimized Gradle configuration for CleverFerret
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configureondemand=true
org.gradle.daemon=false
android.enableJetifier=true
android.incremental=false
