# Project-wide Gradle settings for CleverFerret

# IDE (used by Android Studio and IntelliJ)
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Gradle performance optimizations
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=2g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=false

# Android build optimizations
android.enableJetifier=true
android.incremental=true
android.builder.sdkDownload=false
# Removed deprecated android.enableBuildCache (superseded by Gradle build cache)

# Enable resource optimizations for multi-architecture builds
android.enableResourceOptimizations=false
