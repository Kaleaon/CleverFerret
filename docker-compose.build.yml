version: '3.8'

# CleverFerret Docker Compose Build Configuration
# Includes all permanent fixes for reliable Android builds

services:
  cleverferret-builder:
    build:
      context: .
      dockerfile: Dockerfile.build
      args:
        BUILD_TOOLS_VERSION: "36.0.0"
        COMPILE_SDK_VERSION: "36"
    image: cleverferret-builder:latest
    container_name: cleverferret-build-container
    
    # PERMANENT FIX: Optimized resource allocation
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 6G
          cpus: '2.0'
    
    # Mount source code
    volumes:
      - .:/app
      - gradle-cache:/root/.gradle
      - android-sdk-cache:/workspace/android-sdk
    
    # PERMANENT FIX: Environment variables with all fixes
    environment:
      - ANDROID_HOME=/workspace/android-sdk
      - ANDROID_SDK_ROOT=/workspace/android-sdk
      - BUILD_TOOLS_VERSION=36.0.0
      - COMPILE_SDK_VERSION=36
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - GRADLE_OPTS=-Xmx6144m -XX:MaxMetaspaceSize=2g -XX:+UseG1GC
      - _JAVA_OPTIONS=-Xmx6144m -XX:MaxMetaspaceSize=2g
      
    # Working directory
    working_dir: /app
    
    # Keep container running for interactive builds
    tty: true
    stdin_open: true
    
    # Default build command
    command: ["./build_enhanced_permanent.sh"]
    
    # Health check to ensure build environment is ready
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Alternative lightweight build service for quick iterations
  cleverferret-quick-build:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: cleverferret-builder:latest
    container_name: cleverferret-quick-build
    
    volumes:
      - .:/app
      - gradle-cache:/root/.gradle
    
    environment:
      - USE_MINIMAL_DEPS=true
      - GRADLE_OPTS=-Xmx4096m -XX:MaxMetaspaceSize=1g
      
    working_dir: /app
    command: ["./gradlew", "--no-daemon", "assembleDebug"]

volumes:
  # Persistent caches for faster builds
  gradle-cache:
    driver: local
  android-sdk-cache:
    driver: local

# Usage Instructions:
# 
# Full build with all fixes:
# docker-compose -f docker-compose.build.yml up cleverferret-builder
#
# Quick build with minimal dependencies:
# docker-compose -f docker-compose.build.yml up cleverferret-quick-build
#
# Interactive build environment:
# docker-compose -f docker-compose.build.yml run --rm cleverferret-builder bash
#
# Clean build (remove caches):
# docker-compose -f docker-compose.build.yml down -v