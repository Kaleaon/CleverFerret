# FanFicFare Personal Configuration
# Configuration for adult fanfiction downloader with metabods.com support
# Place this file in: ~/.fanficfare/personal.ini (Linux/Mac) or %APPDATA%\fanficfare\personal.ini (Windows)

[defaults]
# Output format - EPUB is recommended for CleverFerret
output_format:epub

# Enable adult content downloads
include_adult_content:true
is_adult:true

# Add metadata tags
add_genre_tags:true
add_character_tags:true
add_ship_tags:true

# Include extra metadata
include:pubyear
include:publisher
include:language

# Chapter numbering
chapter_title_format:Chapter %d: %t

# Add tables of contents
generate_toc:true

# Include cover images
include_cover:true

# Add author notes
include_author_notes:true

# Story status
include:status

# Rating information
include:rating

# Adult content settings - be explicit about adult content handling
rating_tags:true
content_warning_tags:true

[archiveofourown.org]
# Archive of Our Own - supports adult content
include:authorId
include:datePublished
include:dateUpdated
include:dateCreated
include:kudos
include:bookmarks
include:comments
include:hits

# Enable adult content
is_adult:true
rating_tags:true

[fanfiction.net]
# FanFiction.Net
username:
password:

[metabods.com]
# Metabods.com - Adult transformation fiction
# Custom site configuration for metabods.com
is_adult:true
rating:Mature
rating_tags:true
content_warning_tags:true

# Metabods-specific metadata
include:authorId
include:datePublished
include:dateUpdated
include:storyId
include:views

# Story extraction selectors (may need adjustment based on site structure)
story_title_selector:h1.story-title, h1
author_selector:span.author, a.author, div.author-name
description_selector:div.story-description, div.description, p.description
content_selector:div.story-content, div.chapter-content, article
chapter_selector:a[href*=/chapter], div.chapter-list a
tags_selector:a.tag, span.tag

# Genre defaults
genre:Transformation, Body Modification

# Language
language:English

# Adult content warning
add_to_calibre:true
calibre_tags:Adult, Transformation Fiction, Metabods

[literotica.com]
# Literotica - Adult erotic fiction
is_adult:true
rating:Explicit
rating_tags:true
content_warning_tags:true

# Literotica-specific settings
include:authorId
include:category

# Adult content tags
calibre_tags:Adult, Erotica, Literotica

[questionablequesting.com]
# Questionable Questing - Adult forum fiction
is_adult:true
rating:Mature
rating_tags:true
content_warning_tags:true

# Forum-specific settings
include:threadId
include:forumId

[wattpad.com]
# Wattpad settings
# May require login for mature content
username:
password:

# Adult content handling
check_next_chapter:true

[royalroad.com]
# Royal Road settings
check_next_chapter:true

[scribblehub.com]
# ScribbleHub settings
check_next_chapter:true

# Output customization
[epub]
# EPUB-specific settings
use_css:true
include_images:true
extra_css:
    body { font-family: serif; }
    .adult-warning { color: red; font-weight: bold; }

# Metadata customization
[metadata]
# Add custom series information
include:series
include:seriesUrl

# Add update information
include:dateUpdated
include:numChapters
include:numWords

# Status information
include:status

# Site-specific metadata patterns
[site_patterns]
# Pattern matching for automatic site detection
metabods:metabods\.com
literotica:literotica\.com
ao3:archiveofourown\.org
ffn:fanfiction\.net
wattpad:wattpad\.com
royalroad:royalroad\.com

# Advanced settings
[advanced]
# Rate limiting (milliseconds between requests)
slow_down_sleep_time:1000

# Timeout settings
connect_timeout:30
read_timeout:60

# Retry settings
max_retries:3

# User agent
user_agent:Mozilla/5.0 (compatible; CleverFerret-FanFicFare/1.0)

# Cache settings
use_basic_cache:true

# Error handling
continue_on_chapter_error:false

# Adult content verification
verify_adult_age:true
minimum_age:18

# Content warnings
add_content_warnings:true
explicit_content_tags:Sexual Content, Adult Themes, Explicit Language, Violence, Transformation

# Privacy settings
anonymous_download:false

# Calibre integration
[calibre]
# Calibre library settings
add_to_library:true
library_path:

# Tags to add to Calibre
custom_tags:FanFiction, Web Fiction

# Custom columns (if you have them set up in Calibre)
custom_columns:

# Reading lists
add_to_reading_list:false

# Auto-update settings
check_for_updates:true
update_frequency_days:7

# Backup settings
[backup]
# Keep backup of original files
keep_backup:false
backup_path:

# Site-specific adult content configuration
[adult_sites]
# List of sites known to have adult content
metabods.com:true
literotica.com:true
questionablequesting.com:true
adult-fanfiction.org:true

# Content filtering
[filtering]
# Exclude certain ratings (leave empty to include all)
exclude_ratings:

# Exclude certain tags (leave empty to include all)
exclude_tags:

# Minimum word count (0 for no minimum)
minimum_words:0

# Maximum word count (0 for no maximum)
maximum_words:0

# Story status filter (leave empty for all)
story_status_filter:

# Performance settings
[performance]
# Download chapters in parallel (faster but may be blocked by some sites)
parallel_downloads:false
max_parallel:3

# Compression level for EPUB (0-9, higher = smaller file but slower)
compression_level:6

# Image optimization
optimize_images:true
max_image_width:1200
max_image_height:1600
