name: Feature Request
description: Suggest a new feature for CleverFerret
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible to help us understand your request.

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of what you want to happen
      placeholder: Describe the feature you'd like to see added
    validations:
      required: true

  - type: textarea
    id: problem-solution
    attributes:
      label: Problem/Solution
      description: Is your feature request related to a problem? Please describe the problem and how this feature would solve it.
      placeholder: I'm always frustrated when... This feature would help by...
    validations:
      required: true

  - type: dropdown
    id: feature-category
    attributes:
      label: Feature Category
      description: Which area of the app would this feature belong to?
      options:
        - Library Management
        - Media Viewers (eBook, Video, Audio)
        - Plex Integration
        - Metadata Management
        - Import/Export
        - Search & Discovery
        - Cloud Integration
        - User Interface
        - Accessibility
        - Performance
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve my experience
        - High - Essential for my use case
        - Critical - Can't use the app without it
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe your specific use case and how you would use this feature
      placeholder: I would use this feature when... It would help me...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered
      placeholder: I've tried... but it doesn't work because...

  - type: textarea
    id: examples
    attributes:
      label: Examples/References
      description: Are there any other apps or services that implement this feature well? Please provide examples or links.
      placeholder: App X does this by... Here's a link to an example...

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups about the feature request here

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to ensure this feature hasn't been requested
          required: true
        - label: I have provided a clear description of the feature and its benefits
          required: true
        - label: This feature aligns with CleverFerret's goal of being a universal media library
          required: true