name: Debug Checkout

on:
  push:
    branches:
      - debug-checkout

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checkout
        run: |
          echo "Checkout successful"
          ls -la
