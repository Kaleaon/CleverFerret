        print('🚨 FAILURE REASON:')
        print(results['failure_reason'])
        print()
    
    if 'detailed_analysis' in results and results['detailed_analysis']:
        print('🔍 DETAILED ANALYSIS:')
        print(results['detailed_analysis'])
        print()
    
    if 'issues' in results and results['issues']:
        print(f'📝 FOUND {len(results[\"issues\"])} ISSUE(S):')
        print('=' * 40)
        for i, issue in enumerate(results['issues'], 1):
            severity = issue.get('severity', 'unknown').upper()
            category = issue.get('category', 'general').upper()
