name: AI Code Review & Auto-Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 17
  ANDROID_API_LEVEL: 34
  ANDROID_BUILD_TOOLS: 33.0.2
  GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    outputs:
      review-passed: ${{ steps.review.outputs.passed }}
      review-score: ${{ steps.review.outputs.score }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1)
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Save changed files to temp file
          echo "$CHANGED_FILES" > changed_files.txt
          
          # Get file content changes for review
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} > diff.txt
          else
            git diff HEAD~1 > diff.txt
          fi

      - name: Set up Python for AI Review
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install AI Review Dependencies
        run: |
          pip install requests python-dotenv emergentintegrations --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/

      - name: AI Code Review Analysis
        id: review
        env:
          EMERGENT_LLM_KEY: sk-emergent-aCd2b6dBf57FfC928A
        run: |
          cat > ai_review.py << 'EOF'
import os
import sys
import json
from emergentintegrations import EmergentLLM

def analyze_code_changes():
              try:
                  # Initialize Emergent LLM with Gemini
                  llm = EmergentLLM(
                      api_key=os.environ.get('EMERGENT_LLM_KEY'),
                      provider='gemini'
                  )
                  
                  # Read changed files
                  try:
                      with open('changed_files.txt', 'r') as f:
                          changed_files = f.read().strip()
                      with open('diff.txt', 'r') as f:
                          diff_content = f.read()
                  except FileNotFoundError:
                      print("No changes detected")
                      return {"passed": True, "score": 100, "issues": []}
                  
                  if not changed_files.strip():
                      print("No files changed")
                      return {"passed": True, "score": 100, "issues": []}
                  
                  # Prepare AI review prompt
                  review_prompt = f"""
                  You are an expert Android developer and code reviewer for the CleverFerret Universal Media Library project.
                  
                  CRITICAL INSTRUCTION: If you find ANY issues that could break the build, cause runtime errors, or compromise system integrity, you MUST provide extremely detailed explanations of WHY the code fails review and HOW to fix it.
                  
                  Please analyze the following code changes and provide a comprehensive review focusing on:
                  
                  1. **Build Safety**: Will these changes break the Universal Build System or Gradle configuration?
                  2. **Architecture Compatibility**: Do changes maintain multi-architecture support (x86, ARM64, etc.)?
                  3. **Code Quality**: Are there syntax errors, missing imports, or Android best practices violations?
                  4. **Integration Safety**: Will AI tools, android-tools integration, or dependency injection remain intact?
                  
                  **Changed Files:**
                  {changed_files}
                  
                  **Code Diff:**
                  {diff_content[:8000]}  # Limit to prevent token overflow
                  
                  Respond in JSON format:
                  {{
                    "passed": true/false,
                    "score": 0-100,
                    "failure_reason": "If passed=false, provide a comprehensive explanation of WHY the review failed, what specific problems were found, and the potential impact",
                    "detailed_analysis": "Step-by-step analysis of the code changes, highlighting both good practices and problems found",
                    "issues": [
                      {{
                        "severity": "critical/error/warning/info",
                        "category": "build/architecture/code/integration/security",
                        "file": "exact filename with path",
                        "line_numbers": "specific lines if applicable",
                        "code_snippet": "the problematic code if relevant",
                        "description": "DETAILED explanation of what is wrong",
                        "why_problematic": "Explain WHY this is a problem - what could break, what could fail",
                        "impact": "What would happen if this code went to production",
                        "suggestion": "Step-by-step instructions on how to fix this",
                        "example_fix": "Show corrected code example if applicable"
                      }}
                    ],
                    "build_risk_assessment": "Assess the likelihood this change could break the build (none/low/medium/high/critical)",
                    "runtime_risk_assessment": "Assess the likelihood this could cause runtime failures (none/low/medium/high/critical)", 
                    "recommended_actions": [
                      "List specific actions the developer should take before resubmitting"
                    ],
                    "summary": "Overall assessment with specific focus on WHY the review passed or failed"
                  }}
                  
                  CRITICAL FAILURE CRITERIA (must return passed=false):
                  - Any syntax errors that would prevent compilation
                  - Missing required imports or dependencies
                  - Gradle configuration changes that could break builds
                  - Architecture-specific code that breaks multi-platform support
                  - Changes that would break existing AI tool integrations
                  - Security vulnerabilities or unsafe practices
                  - Code that violates Android development best practices in ways that cause crashes
                  
                  REMEMBER: If passed=false, the "failure_reason" and "detailed_analysis" fields are MANDATORY and must be comprehensive.
                  """
                  
                  response = llm.chat.completions.create(
                      model="gemini-1.5-pro",
                      messages=[{"role": "user", "content": review_prompt}],
                      temperature=0.1
                  )
                  
                  # Parse AI response
                  ai_response = response.choices[0].message.content
                  print(f"AI Response: {ai_response}")
                  
                  # Try to extract JSON from response
                  try:
                      # Look for JSON in the response
                      json_start = ai_response.find('{')
                      json_end = ai_response.rfind('}') + 1
                      if json_start != -1 and json_end > json_start:
                          json_content = ai_response[json_start:json_end]
                          review_result = json.loads(json_content)
                      else:
                          # Fallback parsing
                          review_result = {"passed": True, "score": 85, "issues": [], "summary": "AI review completed"}
                  except json.JSONDecodeError:
                      print("Failed to parse AI response, treating as potential issue")
                      # If we can't parse the response, be cautious and provide detailed feedback
                      review_result = {
                          "passed": False, 
                          "score": 50, 
                          "failure_reason": "AI response could not be parsed properly. The AI may have identified issues but the response format was incorrect.",
                          "detailed_analysis": f"Raw AI Response (first 1000 chars): {ai_response[:1000]}...\n\nThis suggests the AI found complex issues that couldn't be formatted properly. Manual review recommended.",
                          "issues": [{
                              "severity": "warning",
                              "category": "system",
                              "file": "multiple files",
                              "description": "AI review system could not parse the response properly",
                              "why_problematic": "When AI responses can't be parsed, it often indicates the AI found complex or severe issues that broke the expected response format",
                              "impact": "Potential unidentified code quality or safety issues",
                              "suggestion": "Manually review your changes for build safety, syntax errors, and integration issues. Consider making smaller, incremental changes."
                          }], 
                          "build_risk_assessment": "medium",
                          "runtime_risk_assessment": "medium",
                          "recommended_actions": [
                              "Manually review all changed files for syntax errors",
                              "Check that all imports and dependencies are correct",
                              "Verify Gradle configurations haven't been broken",
                              "Test build locally before pushing again"
                          ],
                          "summary": "AI review parsing failed - manual review required for safety"
                      }
                  
                  return review_result
                  
              except Exception as e:
                  print(f"AI Review failed: {str(e)}")
                  # Be more cautious when AI system fails - require manual review
                  return {
                      "passed": False, 
                      "score": 30, 
                      "failure_reason": f"AI review system encountered a critical error: {str(e)}. For safety, this change is blocked pending manual review.",
                      "detailed_analysis": f"The AI review system failed with error: {str(e)}. This could indicate:\n1. Network/API issues preventing proper analysis\n2. Code changes that are too complex for automated review\n3. Issues with the review system itself\n\nTo ensure code quality and safety, manual review is required.",
                      "issues": [{
                          "severity": "critical",
                          "category": "system",
                          "file": "AI Review System",
                          "description": f"AI review system failure: {str(e)}",
                          "why_problematic": "When the AI review system fails, it cannot verify code safety, build compatibility, or quality standards",
                          "impact": "Unreviewed code could introduce bugs, break builds, or compromise system stability",
                          "suggestion": "1. Check if this is a temporary issue by pushing again\n2. If error persists, manually review all changes\n3. Test build locally\n4. Consider breaking large changes into smaller commits"
                      }], 
                      "build_risk_assessment": "high",
                      "runtime_risk_assessment": "unknown",
                      "recommended_actions": [
                          "Try pushing again to see if this was a temporary issue",
                          "If error persists, perform thorough manual code review",
                          "Test build process locally to ensure it works",
                          "Check all modified files for syntax and logic errors",
                          "Verify no critical dependencies or configurations were broken"
                      ],
                      "summary": f"AI review system failure ({str(e)}) - manual review required for safety"
                  }

          if __name__ == "__main__":
              result = analyze_code_changes()
              print(f"Review Result: {json.dumps(result, indent=2)}")
              
              # Set GitHub Actions outputs
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"passed={str(result['passed']).lower()}\n")
                  f.write(f"score={result['score']}\n")
                  f.write(f"summary={result.get('summary', 'AI review completed')}\n")
              
              # Write detailed results to file
              with open('ai_review_results.json', 'w') as f:
                  json.dump(result, f, indent=2)
              
              # Exit with error code if review failed
              if not result['passed']:
                  print("❌ AI Review FAILED - Build will be blocked")
                  sys.exit(1)
              else:
                  print("✅ AI Review PASSED - Proceeding with build")
          EOF
          
          python ai_review.py

      - name: Upload AI Review Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-results-${{ github.sha }}
          path: |
            ai_review_results.json
            changed_files.txt
            diff.txt
          retention-days: 30

      - name: Comment Review Results (PR only)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reviewResults;
            try {
              reviewResults = JSON.parse(fs.readFileSync('ai_review_results.json', 'utf8'));
            } catch (e) {
              reviewResults = { 
                passed: false, 
                score: 0, 
                failure_reason: 'AI review system failed to generate results',
                detailed_analysis: 'The AI review system encountered an error and could not analyze the code changes.',
                issues: [], 
                summary: 'AI review failed to generate results' 
              };
            }
            
            const passed = reviewResults.passed;
            const score = reviewResults.score;
            const issues = reviewResults.issues || [];
            const failureReason = reviewResults.failure_reason;
            const detailedAnalysis = reviewResults.detailed_analysis;
            const buildRisk = reviewResults.build_risk_assessment;
            const runtimeRisk = reviewResults.runtime_risk_assessment;
            const recommendedActions = reviewResults.recommended_actions || [];
            
            let comment = `## 🤖 AI Code Review Results\n\n`;
            comment += `**Status:** ${passed ? '✅ PASSED' : '❌ FAILED'}\n`;
            comment += `**Score:** ${score}/100\n`;
            
            if (buildRisk) {
              comment += `**Build Risk:** ${buildRisk.toUpperCase()}\n`;
            }
            if (runtimeRisk) {
              comment += `**Runtime Risk:** ${runtimeRisk.toUpperCase()}\n`;
            }
            comment += `\n`;
            
            // If review failed, show detailed failure analysis
            if (!passed && failureReason) {
              comment += `## ❌ REVIEW FAILURE ANALYSIS\n\n`;
              comment += `### Why This Review Failed:\n`;
              comment += `${failureReason}\n\n`;
              
              if (detailedAnalysis) {
                comment += `### Detailed Code Analysis:\n`;
                comment += `${detailedAnalysis}\n\n`;
              }
            }
            
            if (issues.length > 0) {
              comment += `## 📋 Issues Found (${issues.length})\n\n`;
              issues.forEach((issue, index) => {
                let icon = '🔵';
                if (issue.severity === 'critical') icon = '🔴⚠️';
                else if (issue.severity === 'error') icon = '🔴';
                else if (issue.severity === 'warning') icon = '🟡';
                
                comment += `### ${icon} ${issue.severity?.toUpperCase() || 'ISSUE'} ${index + 1}: ${issue.category?.toUpperCase() || 'GENERAL'}\n`;
                
                if (issue.file) {
                  comment += `**📁 File:** \`${issue.file}\`\n`;
                }
                
                if (issue.line_numbers) {
                  comment += `**📍 Lines:** ${issue.line_numbers}\n`;
                }
                
                if (issue.code_snippet) {
                  comment += `**📝 Problematic Code:**\n\`\`\`\n${issue.code_snippet}\n\`\`\`\n`;
                }
                
                comment += `**❓ What's Wrong:** ${issue.description}\n\n`;
                
                if (issue.why_problematic) {
                  comment += `**⚠️ Why This Is Problematic:** ${issue.why_problematic}\n\n`;
                }
                
                if (issue.impact) {
                  comment += `**💥 Potential Impact:** ${issue.impact}\n\n`;
                }
                
                if (issue.suggestion) {
                  comment += `**💡 How To Fix:** ${issue.suggestion}\n\n`;
                }
                
                if (issue.example_fix) {
                  comment += `**✅ Corrected Code Example:**\n\`\`\`\n${issue.example_fix}\n\`\`\`\n`;
                }
                
                comment += `---\n\n`;
              });
            }
            
            if (recommendedActions.length > 0) {
              comment += `## 🎯 Recommended Actions\n\n`;
              recommendedActions.forEach((action, index) => {
                comment += `${index + 1}. ${action}\n`;
              });
              comment += `\n`;
            }
            
            comment += `## 📊 Summary\n`;
            comment += `${reviewResults.summary}\n\n`;
            
            if (!passed) {
              comment += `## 🚫 Next Steps\n`;
              comment += `This pull request has been **BLOCKED** due to the issues identified above.\n\n`;
              comment += `**To proceed:**\n`;
              comment += `1. Review each issue listed above carefully\n`;
              comment += `2. Make the necessary code changes\n`;
              comment += `3. Test your changes locally\n`;
              comment += `4. Push your fixes to trigger a new AI review\n\n`;
              comment += `**Need help?** The AI review has provided detailed explanations and examples above.\n\n`;
            } else {
              comment += `## ✅ Approved\n`;
              comment += `Great work! Your code changes look good and will proceed to the build stage.\n\n`;
            }
            
            comment += `---\n*🤖 AI Review powered by Gemini Pro 1.5 | CleverFerret Universal Build System*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  build-and-publish:
    name: Build & Auto-Publish
    runs-on: ubuntu-latest
    needs: ai-review
    if: needs.ai-review.outputs.review-passed == 'true'
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER_PATH="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ -f "$SDKMANAGER_PATH" ]]; then
            yes | "$SDKMANAGER_PATH" --licenses || true
          fi

      - name: Cache Build System
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android-tools/
          key: ai-build-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x build-scripts/*.sh || echo "Build scripts not found"

      - name: Build Debug APK
        run: |
          echo "🔨 Building CleverFerret after AI review approval..."
          
          if [ -f "./build-scripts/simple-build.sh" ]; then
            ./build-scripts/simple-build.sh build debug
          else
            ./gradlew clean assembleDebug --stacktrace
          fi

      - name: Generate Build Info
        id: build-info
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          BRANCH_NAME="${{ github.ref_name }}"
          
          echo "build-date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "commit-short=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Prepare APK for Builds Directory
        run: |
          echo "📦 Preparing APK for builds directory..."
          
          # Find the built APK
          APK_FILE=$(find . -name "*debug*.apk" -type f | head -1)
          
          if [ -n "$APK_FILE" ]; then
            # Create builds directory if it doesn't exist
            mkdir -p builds
            
            # Generate descriptive filename
            FILENAME="CleverFerret-${{ steps.build-info.outputs.branch-name }}-${{ steps.build-info.outputs.commit-short }}-$(date +'%Y%m%d_%H%M%S').apk"
            
            # Copy APK to builds directory
            cp "$APK_FILE" "builds/$FILENAME"
            
            # Generate build manifest
            cat > "builds/BUILD_INFO.md" << EOF
            # CleverFerret Auto-Build
            
            **Build Information:**
            - Build Date: ${{ steps.build-info.outputs.build-date }}
            - Branch: ${{ steps.build-info.outputs.branch-name }}
            - Commit: ${{ steps.build-info.outputs.commit-short }}
            - AI Review Score: ${{ needs.ai-review.outputs.review-score }}/100
            - Trigger: ${{ github.event_name }}
            
            **Latest APK:** \`$FILENAME\`
            
            **Installation:**
            1. Download the APK file
            2. Enable "Install from Unknown Sources" in Android settings
            3. Install the APK on your device
            
            ---
            *Auto-generated by CleverFerret AI Review System*
            EOF
            
            echo "✅ APK prepared: builds/$FILENAME"
            echo "apk-filename=$FILENAME" >> $GITHUB_OUTPUT
          else
            echo "❌ No APK file found!"
            exit 1
          fi

      - name: Commit to Builds Directory
        if: github.event_name == 'push'
        run: |
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add builds directory changes
          git add builds/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-build: Add ${{ steps.build-info.outputs.apk-filename }}

            - Branch: ${{ steps.build-info.outputs.branch-name }}
            - Commit: ${{ steps.build-info.outputs.commit-short }}
            - AI Review Score: ${{ needs.ai-review.outputs.review-score }}/100
            - Build Date: ${{ steps.build-info.outputs.build-date }}"
            
            git push
            echo "✅ APK committed to builds directory"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auto-build-${{ github.sha }}
          path: |
            builds/*.apk
            builds/BUILD_INFO.md
          retention-days: 30

      - name: Build Success Summary
        run: |
          echo "# 🎉 AI-Reviewed Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **AI Review Score:** ${{ needs.ai-review.outputs.review-score }}/100 ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date:** ${{ steps.build-info.outputs.build-date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ steps.build-info.outputs.branch-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ steps.build-info.outputs.commit-short }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** ${{ steps.build-info.outputs.apk-filename }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Status:** APK built and committed to builds/ directory" >> $GITHUB_STEP_SUMMARY

  review-failed:
    name: AI Review Failed
    runs-on: ubuntu-latest
    needs: ai-review
    if: needs.ai-review.outputs.review-passed == 'false'
    
    steps:
      - name: Checkout code (to access review results)
        uses: actions/checkout@v4

      - name: Download AI Review Results
        uses: actions/download-artifact@v4
        with:
          name: ai-review-results-${{ github.sha }}
          path: ./review-results/

      - name: Display Detailed Failure Analysis
        run: |
          echo "❌ AI CODE REVIEW FAILED - BUILD BLOCKED"
          echo "======================================"
          echo ""
          echo "Review Score: ${{ needs.ai-review.outputs.review-score }}/100"
          echo "Summary: ${{ needs.ai-review.outputs.summary }}"
          echo ""
          
          # Try to display detailed review results if available
          if [ -f "./review-results/ai_review_results.json" ]; then
            echo "📋 DETAILED FAILURE ANALYSIS:"
            echo "=============================="
            
            # Extract and display failure details using Python
            python3 -c "
