            if issue.get('file'):
                print(f'  📁 File: {issue[\"file\"]}')
            if issue.get('line_numbers'):
                print(f'  📍 Lines: {issue[\"line_numbers\"]}')
            if issue.get('description'):
                print(f'  ❓ Problem: {issue[\"description\"]}')
            if issue.get('why_problematic'):
                print(f'  ⚠️  Why Problematic: {issue[\"why_problematic\"]}')
            if issue.get('impact'):
                print(f'  💥 Impact: {issue[\"impact\"]}')
            if issue.get('suggestion'):
                print(f'  💡 Fix: {issue[\"suggestion\"]}')
            print()
    
    if 'build_risk_assessment' in results:
        print(f'🏗️  BUILD RISK: {results[\"build_risk_assessment\"].upper()}')
    
    if 'runtime_risk_assessment' in results:
        print(f'⚡ RUNTIME RISK: {results[\"runtime_risk_assessment\"].upper()}')
    
    if 'recommended_actions' in results and results['recommended_actions']:
        print()
        print('🎯 RECOMMENDED ACTIONS:')
        for i, action in enumerate(results['recommended_actions'], 1):
            print(f'  {i}. {action}')
    
except Exception as e:
    print(f'Could not parse detailed results: {e}')
    print('Check the AI review artifacts for full details.')
            " || echo "Could not display detailed analysis"
          else
            echo "⚠️  Detailed review results not available"
          fi
          
          echo ""
          echo "🚫 THIS BUILD HAS BEEN BLOCKED"
          echo "=============================="
          echo "The issues identified above must be resolved before this code can be merged."
          echo ""
          echo "Next steps:"
          echo "1. Carefully review each issue listed above"
          echo "2. Make the necessary code changes"
          echo "3. Test your changes locally to ensure they work"
          echo "4. Push your fixes to trigger a new AI review"
          echo ""
          echo "For more details, check the PR comments or the AI review artifacts."

      - name: Create Detailed Failure Summary
        run: |
          echo "# ❌ AI Review Failed - Build Blocked" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚨 Critical Issues Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The AI reviewer has identified issues that could potentially:" >> $GITHUB_STEP_SUMMARY
          echo "- Break the build process" >> $GITHUB_STEP_SUMMARY
          echo "- Cause runtime failures" >> $GITHUB_STEP_SUMMARY
          echo "- Compromise system stability" >> $GITHUB_STEP_SUMMARY
