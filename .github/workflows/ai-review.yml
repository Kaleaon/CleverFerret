          echo "- **Build Date:** ${{ steps.build-info.outputs.build-date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ steps.build-info.outputs.branch-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ steps.build-info.outputs.commit-short }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK:** ${{ steps.build-info.outputs.apk-filename }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Status:** APK built and committed to builds/ directory" >> $GITHUB_STEP_SUMMARY

