name: AI Code Review & Auto-Build CleverFerret

on:
  push:
    branches: [ main, develop, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even without changes'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  statuses: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 17
  ANDROID_API_LEVEL: 34
  ANDROID_BUILD_TOOLS: 33.0.2
  GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    outputs:
      review-passed: ${{ steps.review.outputs.passed }}
      review-score: ${{ steps.review.outputs.score }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git for AI Review
        run: |
          git config --global user.name "AI Code Reviewer"
          git config --global user.email "ai-reviewer@github.com"
          git config --global init.defaultBranch main
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com" > ~/.git-credentials

      - name: Verify Git Configuration
        run: |
          echo "🔧 Verifying Git configuration..."
          git config --list | grep -E "(user\.|credential\.)"
          echo "📡 Testing Git access..."
          git ls-remote --heads origin | head -5 || echo "⚠️ Git remote access test failed"
          echo "🌿 Current branch: $(git branch --show-current)"
          echo "📊 Repository status:"
          git status --porcelain

      - name: Get changed files
        id: changes
        run: |
          echo "Analyzing repository state..."
          git status
          
          # Ensure we have the latest refs
          git fetch origin --prune
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Processing pull request..."
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            
            # Verify SHAs exist
            if ! git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
              echo "Warning: Base SHA not found, using main branch"
              BASE_SHA="origin/main"
            fi
            
            if ! git rev-parse --verify "$HEAD_SHA" >/dev/null 2>&1; then
              echo "Warning: Head SHA not found, using HEAD"
              HEAD_SHA="HEAD"
            fi
            
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA..$HEAD_SHA" 2>/dev/null || git diff --name-only HEAD~1)
            
            # Get file content changes for review
            git diff "$BASE_SHA..$HEAD_SHA" > diff.txt 2>/dev/null || git diff HEAD~1 > diff.txt
          else
            echo "Processing push event..."
            # For push events, compare with previous commit
            if [ "$(git rev-list --count HEAD)" -gt 1 ]; then
              CHANGED_FILES=$(git diff --name-only HEAD~1)
              git diff HEAD~1 > diff.txt
            else
              # First commit case
              CHANGED_FILES=$(git ls-tree --name-only -r HEAD)
              git show HEAD --format="" > diff.txt
            fi
          fi
          
          echo "Changed files detected:"
          echo "$CHANGED_FILES"
          
          # Save changed files to temp file
          echo "$CHANGED_FILES" > changed_files.txt
          
          # Verify we have content to review
          if [ ! -s changed_files.txt ]; then
            echo "No changes detected"
            echo "" > changed_files.txt
          fi
          
          if [ ! -s diff.txt ]; then
            echo "No diff content available"
            echo "" > diff.txt
          fi

      - name: Set up Python for AI Review
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install AI Review Dependencies
        run: |
          pip install requests python-dotenv google-generativeai

      - name: AI Code Review Analysis
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > ai_review.py << 'EOF'
          import os
          import sys
          import json
          import subprocess
          import google.generativeai as genai
          
          def run_git_command(command, check=True):
              """Safely run git commands with error handling"""
              try:
                  result = subprocess.run(command, shell=True, capture_output=True, text=True, check=check)
                  return result.stdout.strip()
              except subprocess.CalledProcessError as e:
                  print(f"Git command failed: {command}")
                  print(f"Error: {e.stderr}")
                  return None
          
          def apply_code_fix(file_path, original_code, fixed_code):
              """Apply AI-suggested code fixes to files"""
              try:
                  if os.path.exists(file_path):
                      with open(file_path, 'r', encoding='utf-8') as f:
                          current_content = f.read()
                      
                      # Apply the fix (simple replacement for now)
                      if original_code.strip() in current_content:
                          updated_content = current_content.replace(original_code.strip(), fixed_code.strip())
                          
                          with open(file_path, 'w', encoding='utf-8') as f:
                              f.write(updated_content)
                          
                          print(f"✅ Applied fix to {file_path}")
                          return True
                      else:
                          print(f"⚠️ Original code not found in {file_path}")
                  return False
              except Exception as e:
                  print(f"❌ Failed to apply fix to {file_path}: {str(e)}")
                  return False
          
          def commit_fixes(changed_files):
              """Commit any fixes made by the AI"""
              try:
                  # Check if there are changes to commit
                  git_status = run_git_command("git status --porcelain", check=False)
                  if not git_status:
                      print("No changes to commit")
                      return True
                  
                  # Configure git user for this operation
                  run_git_command('git config user.name "AI Code Reviewer"', check=False)
                  run_git_command('git config user.email "ai-reviewer@github.com"', check=False)
                  
                  # Add changed files
                  for file_path in changed_files.split('\n'):
                      if file_path.strip() and os.path.exists(file_path.strip()):
                          run_git_command(f'git add "{file_path.strip()}"', check=False)
                  
                  # Commit changes
                  commit_msg = "🤖 AI Code Review: Auto-fix identified issues"
                  result = run_git_command(f'git commit -m "{commit_msg}"', check=False)
                  
                  if result is not None:
                      print("✅ Committed AI fixes successfully")
                      return True
                  else:
                      print("⚠️ No changes committed (possibly no actual changes)")
                      return True
                      
              except Exception as e:
                  print(f"❌ Failed to commit fixes: {str(e)}")
                  return False
          
          def analyze_code_changes():
              try:
                  # Initialize Google Gemini API
                  api_key = os.environ.get('GEMINI_API_KEY')
                  if not api_key:
                      raise Exception("GEMINI_API_KEY environment variable not set")
                  
                  genai.configure(api_key=api_key)
                  model = genai.GenerativeModel('gemini-2.0-flash-exp')
                  
                  # Read changed files
                  try:
                      with open('changed_files.txt', 'r') as f:
                          changed_files = f.read().strip()
                      with open('diff.txt', 'r') as f:
                          diff_content = f.read()
                  except FileNotFoundError:
                      print("No changes detected")
                      return {"passed": True, "score": 100, "issues": []}
                  
                  if not changed_files.strip():
                      print("No files changed")
                      return {"passed": True, "score": 100, "issues": []}
                  
                  # Prepare AI review prompt with auto-fix capability
                  review_prompt = f"""
          You are an expert Android developer and code reviewer for the CleverFerret Universal Media Library project.
          
          CRITICAL INSTRUCTION: Analyze the code changes and provide both a review AND fixes for any issues found.
          
          For each issue you find, you MUST provide:
          1. Detailed explanation of the problem
          2. The exact original code that needs to be fixed
          3. The exact corrected code to replace it with
          4. Clear instructions on which file to modify
          
          Please analyze the following code changes and provide a comprehensive review focusing on:
          
          1. **Build Safety**: Will these changes break the Universal Build System or Gradle configuration?
          2. **Architecture Compatibility**: Do changes maintain multi-architecture support (x86, ARM64, etc.)?
          3. **Code Quality**: Are there syntax errors, missing imports, or Android best practices violations?
          4. **Integration Safety**: Will AI tools, android-tools integration, or dependency injection remain intact?
          
          **Changed Files:**
          {changed_files}
          
          **Code Diff:**
          {diff_content[:8000]}
          
          Respond in JSON format with BOTH analysis AND fixes:
          {{
            "passed": true/false,
            "score": 0-100,
            "failure_reason": "If passed=false, comprehensive explanation of WHY",
            "detailed_analysis": "Step-by-step analysis of the code changes",
            "auto_fixes_applied": true/false,
            "fixes": [
              {{
                "file_path": "exact file path relative to project root",
                "original_code": "the exact problematic code to be replaced",
                "fixed_code": "the exact corrected code replacement", 
                "explanation": "why this fix is necessary",
                "line_range": "approximate line numbers if known"
              }}
            ],
            "issues": [
              {{
                "severity": "critical/error/warning/info",
                "category": "build/architecture/code/integration/security",
                "file": "exact filename with path",
                "line_numbers": "specific lines if applicable",
                "code_snippet": "the problematic code",
                "description": "DETAILED explanation of what is wrong",
                "why_problematic": "Explain WHY this is a problem",
                "impact": "What would happen if this code went to production",
                "suggestion": "Step-by-step instructions on how to fix this",
                "example_fix": "Show corrected code example",
                "auto_fixable": true/false
              }}
            ],
            "build_risk_assessment": "none/low/medium/high/critical",
            "runtime_risk_assessment": "none/low/medium/high/critical", 
            "recommended_actions": [
              "List specific actions the developer should take"
            ],
            "summary": "Overall assessment with focus on fixes applied"
          }}
          
          IMPORTANT: For any fixable issues, provide the exact original and fixed code in the "fixes" array.
          """
                  
                  response = model.generate_content(review_prompt)
                  
                  # Parse AI response
                  ai_response = response.text
                  print(f"AI Response: {ai_response}")
                  
                  # Try to extract JSON from response
                  try:
                      # Look for JSON in the response
                      json_start = ai_response.find('{')
                      json_end = ai_response.rfind('}') + 1
                      if json_start != -1 and json_end > json_start:
                          json_content = ai_response[json_start:json_end]
                          review_result = json.loads(json_content)
                          
                          # Apply any fixes provided by the AI
                          if 'fixes' in review_result and review_result['fixes']:
                              print(f"🔧 Applying {len(review_result['fixes'])} AI-suggested fixes...")
                              fixes_applied = 0
                              
                              for fix in review_result['fixes']:
                                  file_path = fix.get('file_path', '')
                                  original_code = fix.get('original_code', '')
                                  fixed_code = fix.get('fixed_code', '')
                                  
                                  if file_path and original_code and fixed_code:
                                      if apply_code_fix(file_path, original_code, fixed_code):
                                          fixes_applied += 1
                              
                              if fixes_applied > 0:
                                  print(f"✅ Successfully applied {fixes_applied} fixes")
                                  review_result['auto_fixes_applied'] = True
                                  
                                  # Commit the fixes
                                  if commit_fixes(changed_files):
                                      print("✅ AI fixes committed successfully")
                                      # Update the review to reflect fixes
                                      review_result['passed'] = True
                                      review_result['score'] = max(review_result.get('score', 0), 85)
                                      review_result['summary'] = f"AI review completed with {fixes_applied} auto-fixes applied. " + review_result.get('summary', '')
                                  else:
                                      print("⚠️ Failed to commit fixes")
                              else:
                                  print("⚠️ No fixes were successfully applied")
                      else:
                          # Fallback parsing
                          review_result = {"passed": True, "score": 85, "issues": [], "summary": "AI review completed"}
                  except json.JSONDecodeError as e:
                      print(f"Failed to parse AI response: {e}")
                      review_result = {
                          "passed": False, 
                          "score": 50, 
                          "failure_reason": "AI response could not be parsed properly.",
                          "issues": [], 
                          "summary": "AI review parsing failed - manual review required"
                      }
                  
                  return review_result
                  
              except Exception as e:
                  print(f"AI Review failed: {str(e)}")
                  return {
                      "passed": False, 
                      "score": 30, 
                      "failure_reason": f"AI review system encountered a critical error: {str(e)}",
                      "issues": [], 
                      "summary": f"AI review system failure - manual review required"
                  }
          
          if __name__ == "__main__":
              result = analyze_code_changes()
              print(f"Review Result: {json.dumps(result, indent=2)}")
              
              # Set GitHub Actions outputs
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"passed={str(result['passed']).lower()}\n")
                  f.write(f"score={result['score']}\n")
                  f.write(f"summary={result.get('summary', 'AI review completed')}\n")
              
              # Write detailed results to file
              with open('ai_review_results.json', 'w') as f:
                  json.dump(result, f, indent=2)
              
              # Exit with appropriate code
              if not result['passed']:
                  print("❌ AI Review FAILED - Issues need manual attention")
                  sys.exit(1)
              else:
                  print("✅ AI Review PASSED - Proceeding with build")
          EOF
          
          python ai_review.py

      - name: Upload AI Review Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-results-${{ github.sha }}
          path: |
            ai_review_results.json
            changed_files.txt
            diff.txt
          retention-days: 30

      - name: Comment Review Results (PR only)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reviewResults;
            try {
              reviewResults = JSON.parse(fs.readFileSync('ai_review_results.json', 'utf8'));
            } catch (e) {
              reviewResults = { 
                passed: false, 
                score: 0, 
                failure_reason: 'AI review system failed to generate results',
                detailed_analysis: 'The AI review system encountered an error and could not analyze the code changes.',
                issues: [], 
                summary: 'AI review failed to generate results' 
              };
            }
            
            const passed = reviewResults.passed;
            const score = reviewResults.score;
            const issues = reviewResults.issues || [];
            const failureReason = reviewResults.failure_reason;
            const detailedAnalysis = reviewResults.detailed_analysis;
            const buildRisk = reviewResults.build_risk_assessment;
            const runtimeRisk = reviewResults.runtime_risk_assessment;
            const recommendedActions = reviewResults.recommended_actions || [];
            
            let comment = `## 🤖 AI Code Review Results\n\n`;
            comment += `**Status:** ${passed ? '✅ PASSED' : '❌ FAILED'}\n`;
            comment += `**Score:** ${score}/100\n`;
            
            if (buildRisk) {
              comment += `**Build Risk:** ${buildRisk.toUpperCase()}\n`;
            }
            if (runtimeRisk) {
              comment += `**Runtime Risk:** ${runtimeRisk.toUpperCase()}\n`;
            }
            comment += `\n`;
            
            // If review failed, show detailed failure analysis
            if (!passed && failureReason) {
              comment += `## ❌ REVIEW FAILURE ANALYSIS\n\n`;
              comment += `### Why This Review Failed:\n`;
              comment += `${failureReason}\n\n`;
              
              if (detailedAnalysis) {
                comment += `### Detailed Code Analysis:\n`;
                comment += `${detailedAnalysis}\n\n`;
              }
            }
            
            if (issues.length > 0) {
              comment += `## 📋 Issues Found (${issues.length})\n\n`;
              issues.forEach((issue, index) => {
                let icon = '🔵';
                if (issue.severity === 'critical') icon = '🔴⚠️';
                else if (issue.severity === 'error') icon = '🔴';
                else if (issue.severity === 'warning') icon = '🟡';
                
                comment += `### ${icon} ${issue.severity?.toUpperCase() || 'ISSUE'} ${index + 1}: ${issue.category?.toUpperCase() || 'GENERAL'}\n`;
                
                if (issue.file) {
                  comment += `**📁 File:** \`${issue.file}\`\n`;
                }
                
                if (issue.line_numbers) {
                  comment += `**📍 Lines:** ${issue.line_numbers}\n`;
                }
                
                if (issue.code_snippet) {
                  comment += `**📝 Problematic Code:**\n\`\`\`\n${issue.code_snippet}\n\`\`\`\n`;
                }
                
                comment += `**❓ What's Wrong:** ${issue.description}\n\n`;
                
                if (issue.why_problematic) {
                  comment += `**⚠️ Why This Is Problematic:** ${issue.why_problematic}\n\n`;
                }
                
                if (issue.impact) {
                  comment += `**💥 Potential Impact:** ${issue.impact}\n\n`;
                }
                
                if (issue.suggestion) {
                  comment += `**💡 How To Fix:** ${issue.suggestion}\n\n`;
                }
                
                if (issue.example_fix) {
                  comment += `**✅ Corrected Code Example:**\n\`\`\`\n${issue.example_fix}\n\`\`\`\n`;
                }
                
                comment += `---\n\n`;
              });
            }
            
            if (recommendedActions.length > 0) {
              comment += `## 🎯 Recommended Actions\n\n`;
              recommendedActions.forEach((action, index) => {
                comment += `${index + 1}. ${action}\n`;
              });
              comment += `\n`;
            }
            
            comment += `## 📊 Summary\n`;
            comment += `${reviewResults.summary}\n\n`;
            
            if (!passed) {
              comment += `## 🚫 Next Steps\n`;
              comment += `This pull request has been **BLOCKED** due to the issues identified above.\n\n`;
              comment += `**To proceed:**\n`;
              comment += `1. Review each issue listed above carefully\n`;
              comment += `2. Make the necessary code changes\n`;
              comment += `3. Test your changes locally\n`;
              comment += `4. Push your fixes to trigger a new AI review\n\n`;
              comment += `**Need help?** The AI review has provided detailed explanations and examples above.\n\n`;
            } else {
              comment += `## ✅ Approved\n`;
              comment += `Great work! Your code changes look good and will proceed to the build stage.\n\n`;
            }
            
            comment += `---\n*🤖 AI Review powered by Gemini Pro 1.5 | CleverFerret Universal Build System*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  build-and-publish:
    name: Build & Auto-Publish
    runs-on: ubuntu-latest
    needs: ai-review
    if: needs.ai-review.outputs.review-passed == 'true'
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "AI Code Reviewer"
          git config --global user.email "ai-reviewer@github.com"
          git config --global init.defaultBranch main
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com" > ~/.git-credentials

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Cache Build System
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            modern-android-tools/
          key: ai-build-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradlew*') }}

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x build-scripts/*.sh || echo "Build scripts not found"

      - name: Build Debug APK
        run: |
          echo "🔨 Building CleverFerret after AI review approval..."
          
          if [ -f "./build-scripts/simple-build.sh" ]; then
            ./build-scripts/simple-build.sh build debug
          else
            ./gradlew clean assembleDebug --stacktrace
          fi

      - name: Generate Build Info
        id: build-info
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          BRANCH_NAME="${{ github.ref_name }}"
          
          echo "build-date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "commit-short=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Prepare APK for Builds Directory
        run: |
          echo "📦 Preparing APK for builds directory..."
          
          # Find the built APK
          APK_FILE=$(find . -name "*debug*.apk" -type f | head -1)
          
          if [ -n "$APK_FILE" ]; then
            # Create builds directory if it doesn't exist
            mkdir -p builds
            
            # Generate descriptive filename
            FILENAME="CleverFerret-${{ steps.build-info.outputs.branch-name }}-${{ steps.build-info.outputs.commit-short }}-$(date +'%Y%m%d_%H%M%S').apk"
            
            # Copy APK to builds directory
            cp "$APK_FILE" "builds/$FILENAME"
            
            # Generate build manifest
            cat > "builds/BUILD_INFO.md" << EOF
            # CleverFerret Auto-Build
            
            **Build Information:**
            - Build Date: ${{ steps.build-info.outputs.build-date }}
            - Branch: ${{ steps.build-info.outputs.branch-name }}
            - Commit: ${{ steps.build-info.outputs.commit-short }}
            - AI Review Score: ${{ needs.ai-review.outputs.review-score }}/100
            - Trigger: ${{ github.event_name }}
            
            **Latest APK:** \`$FILENAME\`
            
            **Installation:**
            1. Download the APK file
            2. Enable "Install from Unknown Sources" in Android settings
            3. Install the APK on your device
            
            ---
            *Auto-generated by CleverFerret AI Review System*
            EOF
            
            echo "✅ APK prepared: builds/$FILENAME"
            echo "apk-filename=$FILENAME" >> $GITHUB_OUTPUT
          else
            echo "❌ No APK file found!"
            exit 1
          fi

      - name: Upload CleverFerret APK as Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: CleverFerret-APK-${{ steps.build-info.outputs.build-date }}
          path: |
            CleverFerret/build/outputs/apk/debug/*.apk
            CleverFerret/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Commit to Builds Directory
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git with token authentication
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git config --local credential.helper ""
          git config --local --add credential.helper store
          echo "https://x-access-token:${GITHUB_TOKEN}@github.com" > ~/.git-credentials
          
          # Add builds directory changes
          git add builds/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new build artifacts to commit"
          else
            echo "Committing new build artifacts..."
            git commit -m "🤖 Auto-build: Add ${{ steps.build-info.outputs.apk-filename }}

            - Branch: ${{ steps.build-info.outputs.branch-name }}
            - Commit: ${{ steps.build-info.outputs.commit-short }}
            - AI Review Score: ${{ needs.ai-review.outputs.review-score }}/100
            - Build Date: ${{ steps.build-info.outputs.build-date }}"
            
            # Push with retry mechanism
            for attempt in 1 2 3; do
              echo "Push attempt $attempt..."
              if git push origin HEAD:${{ github.ref_name }}; then
                echo "✅ APK committed to builds directory successfully"
                break
              else
                if [ $attempt -eq 3 ]; then
                  echo "❌ Failed to push after 3 attempts"
                  exit 1
                fi
                echo "Retrying push in 5 seconds..."
                sleep 5
              fi
            done
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auto-build-${{ github.sha }}
          path: |
            builds/*.apk
            builds/BUILD_INFO.md
          retention-days: 30

      - name: Build Success Summary
        run: |
          echo "# 🎉 AI-Reviewed Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Information" >> $GITHUB_STEP_SUMMARY
