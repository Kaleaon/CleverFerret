name: Multi-Device Testing

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test level'
        required: true
        default: 'standard'
        type: choice
        options:
        - quick
        - standard
        - comprehensive

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  JAVA_VERSION: '17'

jobs:
  test-config:
    name: Determine Test Configuration
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.config.outputs.matrix }}
      test-level: ${{ steps.config.outputs.level }}
    
    steps:
      - name: Configure test matrix
        id: config
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event.inputs.test_level }}" == "comprehensive" ]]; then
            matrix='[
              {"api": 24, "arch": "arm64-v8a", "target": "default"},
              {"api": 28, "arch": "arm64-v8a", "target": "default"},
              {"api": 30, "arch": "arm64-v8a", "target": "google_apis"},
              {"api": 33, "arch": "arm64-v8a", "target": "google_apis"},
              {"api": 34, "arch": "arm64-v8a", "target": "google_apis"}
            ]'
            level="comprehensive"
          elif [[ "${{ github.event.inputs.test_level }}" == "quick" ]]; then
            matrix='[
              {"api": 30, "arch": "arm64-v8a", "target": "google_apis"}
            ]'
            level="quick"
          else
            matrix='[
              {"api": 24, "arch": "arm64-v8a", "target": "default"},
              {"api": 30, "arch": "arm64-v8a", "target": "google_apis"},
              {"api": 34, "arch": "arm64-v8a", "target": "google_apis"}
            ]'
            level="standard"
          fi
          
          echo "matrix=$(echo "${matrix}" | jq -c .)" >> $GITHUB_OUTPUT
          echo "level=${level}" >> $GITHUB_OUTPUT
          
          echo "## Test Configuration: ${level}" >> $GITHUB_STEP_SUMMARY
          echo "${matrix}" | jq -r '.[] | "- API \(.api) (\(.arch))"' >> $GITHUB_STEP_SUMMARY

  instrumentation-tests:
    name: API ${{ matrix.config.api }} (${{ matrix.config.arch }})
    runs-on: macos-14
    needs: [test-config]
    
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.test-config.outputs.test-matrix) }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.config.api }}
          arch: ${{ matrix.config.arch }}
          target: ${{ matrix.config.target }}
          emulator-options: -no-window -no-snapshot-save -no-audio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 1200
          script: |
            echo "Verifying emulator is available..."
            $ANDROID_HOME/platform-tools/adb devices
            echo "Running connected tests..."
            ./gradlew connectedCheck

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumentation-test-api${{ matrix.config.api }}-${{ matrix.config.arch }}
          path: '**/build/reports/androidTests/'
          retention-days: 14