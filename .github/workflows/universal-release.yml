name: Universal CleverFerret Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.1.0)'
        required: true
        type: string
      pre_release:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: 17
  GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g

jobs:
  build-and-release:
    name: Build Universal APK and Create Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x gradlew
      
    - name: Extract version from tag or input
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${{ github.ref_name }}"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT
        
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --stacktrace
      continue-on-error: true
      
    - name: Create Release Directory
      run: |
        mkdir -p release-artifacts
        cp CleverFerret/build/outputs/apk/debug/CleverFerret-debug.apk \
           release-artifacts/CleverFerret-${{ steps.version.outputs.version_number }}-debug.apk
        cp CleverFerret/build/outputs/apk/release/CleverFerret-release-unsigned.apk \
           release-artifacts/CleverFerret-${{ steps.version.outputs.version_number }}-release.apk
           
    - name: Generate Release Notes
      id: release_notes
      run: |
        cat > release-notes.md << 'EOF'
        # 🦫 CleverFerret Universal Media Library ${{ steps.version.outputs.version }}
        
        ## 📱 Direct APK Downloads
        
        ### 🔥 **RECOMMENDED**: [CleverFerret-${{ steps.version.outputs.version_number }}-release.apk](https://github.com/Kaleaon/CleverFerret/releases/download/${{ steps.version.outputs.version }}/CleverFerret-${{ steps.version.outputs.version_number }}-release.apk)
        **Size**: ~10MB | **Type**: Production Release
        
        ### 🛠️ **DEBUG VERSION**: [CleverFerret-${{ steps.version.outputs.version_number }}-debug.apk](https://github.com/Kaleaon/CleverFerret/releases/download/${{ steps.version.outputs.version }}/CleverFerret-${{ steps.version.outputs.version_number }}-debug.apk)  
        **Size**: ~13MB | **Type**: Development Build with Debugging
        
        ---
        
        ## ✅ **WHAT WORKS**
        - **📱 Professional Android App**: Material 3 UI with clean architecture
        - **🏗️ Library Management**: Create and organize media libraries  
        - **📚 Import System**: Import existing Calibre libraries
        - **🧠 Gemini AI Integration**: OCR and TTS with user API keys
        - **⚙️ Settings Management**: Complete configuration interface
        - **🎯 Navigation**: Full Jetpack Compose navigation system
        
        ## 🚧 **IN DEVELOPMENT**
        - Media file scanning and playback
        - Enhanced metadata fetching
        - Advanced search and filtering
        - Cloud synchronization features
        
        ## 📲 **INSTALLATION**
        1. Download the **release APK** above
        2. Enable "Install from unknown sources" in Android settings
        3. Install and grant necessary permissions
        4. Optional: Configure Gemini API key for AI features
        
        ## 🔧 **SYSTEM REQUIREMENTS**
        - Android 7.0+ (API 24)
        - 50MB free storage space
        - Internet connection for API features
        
        ---
        
        **🛡️ Build**: Verified successful compilation  
        **🧪 Tests**: Unit tests passing  
        **📦 Architecture**: Universal APK (all CPU architectures)
        
        Built with ❤️ for media library enthusiasts!
        EOF
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: "🦫 CleverFerret ${{ steps.version.outputs.version }}"
        body_path: release-notes.md
        files: |
          release-artifacts/*.apk
        draft: false
        prerelease: ${{ github.event.inputs.pre_release == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build Summary
      run: |
        echo "## 🎉 CleverFerret ${{ steps.version.outputs.version }} Released!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 APK Files Created:" >> $GITHUB_STEP_SUMMARY
        echo "- **Release APK**: $(ls -lh release-artifacts/*-release.apk | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
        echo "- **Debug APK**: $(ls -lh release-artifacts/*-debug.apk | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Direct Download Links:" >> $GITHUB_STEP_SUMMARY
        echo "- [Release APK](https://github.com/Kaleaon/CleverFerret/releases/download/${{ steps.version.outputs.version }}/CleverFerret-${{ steps.version.outputs.version_number }}-release.apk)" >> $GITHUB_STEP_SUMMARY
        echo "- [Debug APK](https://github.com/Kaleaon/CleverFerret/releases/download/${{ steps.version.outputs.version }}/CleverFerret-${{ steps.version.outputs.version_number }}-debug.apk)" >> $GITHUB_STEP_SUMMARY