# Android CI/CD Pipeline - FIXED
# Fixed YAML syntax and updated actions

name: Android CI/CD Pipeline (Fixed)

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS: '33.0.2'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: ${{ env.ANDROID_API_LEVEL }}
        build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
        
    - name: Accept Android SDK Licenses
      run: |
        SDKMANAGER_PATH="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [[ -f "$SDKMANAGER_PATH" ]]; then
          yes | "$SDKMANAGER_PATH" --licenses || true
        fi
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest || echo "Unit tests not configured"
      
    - name: Run lint checks
      run: ./gradlew lintDebug || echo "Lint not configured"
      
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-${{ github.sha }}
        path: |
          CleverFerret/build/reports/tests/
          CleverFerret/build/reports/lint-results-debug.html
        retention-days: 14

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    
    outputs:
      version-name: ${{ steps.version.outputs.version-name }}
      version-code: ${{ steps.version.outputs.version-code }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: ${{ env.ANDROID_API_LEVEL }}
        build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
        
    - name: Accept Android SDK Licenses
      run: |
        SDKMANAGER_PATH="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [[ -f "$SDKMANAGER_PATH" ]]; then
          yes | "$SDKMANAGER_PATH" --licenses || true
        fi
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Extract version information
      id: version
      run: |
        # Default version info if gradle tasks don't exist
        VERSION_NAME="1.0.0"
        VERSION_CODE="1"
        
        # Try to get version from gradle if tasks exist
        if ./gradlew tasks | grep -q "printVersionName"; then
          VERSION_NAME=$(./gradlew -q printVersionName | tail -n1)
        fi
        if ./gradlew tasks | grep -q "printVersionCode"; then
          VERSION_CODE=$(./gradlew -q printVersionCode | tail -n1)
        fi
        
        echo "version-name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version-code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "Version Name: $VERSION_NAME"
        echo "Version Code: $VERSION_CODE"
        
    - name: Build debug APK
      run: |
        # Use Universal Build System if available
        if [ -f "build-scripts/simple-build.sh" ]; then
          chmod +x build-scripts/*.sh
          ./build-scripts/simple-build.sh build debug
        else
          ./gradlew assembleDebug
        fi
      
    - name: Build release APK
      run: |
        # Use Universal Build System if available
        if [ -f "build-scripts/simple-build.sh" ]; then
          ./build-scripts/simple-build.sh build release
        else
          ./gradlew assembleRelease
        fi
      
    - name: Sign release APK
      id: sign_apk
      if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Find release APK
        release_apk=$(find . -name "*release*.apk" -type f | head -1)
        
        if [[ -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" && -n "$release_apk" ]]; then
          echo "Signing APK with keystore..."
          # Create keystore from base64 encoded secret
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks
          
          # Sign the APK
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$release_apk" \
            "$KEY_ALIAS"
            
          # Align the APK
          aligned_apk="${release_apk%-unsigned.apk}-signed.apk"
          $ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/zipalign -v 4 \
            "$release_apk" \
            "$aligned_apk"
            
          echo "signed=true" >> $GITHUB_OUTPUT
          echo "APK signed successfully"
        else
          echo "Keystore secrets not available or APK not found, using unsigned APK"
          echo "signed=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Rename APK files
      run: |
        VERSION_NAME="${{ steps.version.outputs.version-name }}"
        
        # Find and rename debug APK
        debug_apk=$(find . -name "*debug*.apk" -type f | head -1)
        if [[ -n "$debug_apk" ]]; then
          debug_dir=$(dirname "$debug_apk")
          mv "$debug_apk" "$debug_dir/CleverFerret-v${VERSION_NAME}-debug.apk"
        fi
        
        # Find and rename release APK
        release_apk=$(find . -name "*release*.apk" -type f | head -1)
        if [[ -n "$release_apk" ]]; then
          release_dir=$(dirname "$release_apk")
          if [[ "${{ steps.sign_apk.outputs.signed }}" == "true" ]]; then
            mv "$release_apk" "$release_dir/CleverFerret-v${VERSION_NAME}-release.apk"
          else
            mv "$release_apk" "$release_dir/CleverFerret-v${VERSION_NAME}-release-unsigned.apk"
          fi
        fi
        
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk-${{ github.sha }}
        path: "**/CleverFerret-v${{ steps.version.outputs.version-name }}-debug.apk"
        retention-days: 30
        
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk-${{ github.sha }}
        path: "**/CleverFerret-v${{ steps.version.outputs.version-name }}-release*.apk"
        retention-days: 90

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download release APK
      uses: actions/download-artifact@v4
      with:
        name: release-apk-${{ github.sha }}
        path: ./apk/
        
    - name: Download debug APK
      uses: actions/download-artifact@v4
      with:
        name: debug-apk-${{ github.sha }}
        path: ./apk/
        
    - name: Generate changelog
      id: changelog
      run: |
        # Generate changelog from git commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${LAST_TAG}..HEAD)
        else
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --max-count=10)
        fi
        
        # Save changelog to file
        cat > CHANGELOG.md << EOF
        # CleverFerret Universal Media Library v${{ needs.build.outputs.version-name }}
        
        ## What's New
        
        $CHANGELOG
        
        ## Installation
        
        1. Download the APK file below
        2. Enable "Install from Unknown Sources" in Android settings
        3. Install the APK on your Android device
        
        ## Features
        
        - Universal media library management
        - Modern Material 3 UI
        - Multi-format media support
        - Calibre integration
        
        ## System Requirements
        
        - Android 7.0 (API level 24) or higher
        - 100MB free storage space
        EOF
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: CleverFerret v${{ needs.build.outputs.version-name }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
        files: |
          apk/CleverFerret-v${{ needs.build.outputs.version-name }}-release*.apk
          apk/CleverFerret-v${{ needs.build.outputs.version-name }}-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.build.result == 'success'
      run: |
        echo "✅ Build completed successfully!"
        echo "Version: ${{ needs.build.outputs.version-name }}"
        echo "Build artifacts are available in the Actions tab"
        
    - name: Notify failure
      if: needs.build.result == 'failure'
      run: |
        echo "❌ Build failed!"
        echo "Check the build logs for details"
        exit 1