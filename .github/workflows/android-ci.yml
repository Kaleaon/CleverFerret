name: Android CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: '34.0.0'
        cmake-version: '3.22.1'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest
      
    - name: Run lint checks
      run: ./gradlew lintDebug
      
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: |
          CleverFerret/build/reports/tests/
          CleverFerret/build/reports/lint-results-debug.html

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    
    outputs:
      version-name: ${{ steps.version.outputs.version-name }}
      version-code: ${{ steps.version.outputs.version-code }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Extract version information
      id: version
      run: |
        VERSION_NAME=$(./gradlew -q printVersionName | tail -n1)
        VERSION_CODE=$(./gradlew -q printVersionCode | tail -n1)
        echo "version-name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version-code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "Version Name: $VERSION_NAME"
        echo "Version Code: $VERSION_CODE"
        
    - name: Build debug APK
      run: ./gradlew assembleDebug
      
    - name: Build release APK (unsigned)
      run: ./gradlew assembleRelease
      
    - name: Sign release APK
      id: sign_apk
      if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [[ -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
          echo "Signing APK with keystore..."
          # Create keystore from base64 encoded secret
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks
          
          # Sign the APK
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            CleverFerret/build/outputs/apk/release/CleverFerret-release-unsigned.apk \
            "$KEY_ALIAS"
            
          # Align the APK
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
            CleverFerret/build/outputs/apk/release/CleverFerret-release-unsigned.apk \
            CleverFerret/build/outputs/apk/release/CleverFerret-release-signed.apk
            
          echo "signed=true" >> $GITHUB_OUTPUT
          echo "APK signed successfully"
        else
          echo "Keystore secrets not available, using unsigned APK"
          cp CleverFerret/build/outputs/apk/release/CleverFerret-release-unsigned.apk \
             CleverFerret/build/outputs/apk/release/CleverFerret-release-signed.apk
          echo "signed=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Rename APK files
      run: |
        VERSION_NAME="${{ steps.version.outputs.version-name }}"
        VERSION_CODE="${{ steps.version.outputs.version-code }}"
        
        # Rename debug APK
        mv CleverFerret/build/outputs/apk/debug/CleverFerret-debug.apk \
           CleverFerret/build/outputs/apk/debug/CleverFerret-v${VERSION_NAME}-debug.apk
           
        # Rename release APK
        if [[ -f "CleverFerret/build/outputs/apk/release/CleverFerret-release-signed.apk" ]]; then
          mv CleverFerret/build/outputs/apk/release/CleverFerret-release-signed.apk \
             CleverFerret/build/outputs/apk/release/CleverFerret-v${VERSION_NAME}-release.apk
        else
          mv CleverFerret/build/outputs/apk/release/CleverFerret-release-unsigned.apk \
             CleverFerret/build/outputs/apk/release/CleverFerret-v${VERSION_NAME}-release-unsigned.apk
        fi
        
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: CleverFerret/build/outputs/apk/debug/CleverFerret-v${{ steps.version.outputs.version-name }}-debug.apk
        retention-days: 30
        
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: CleverFerret/build/outputs/apk/release/CleverFerret-v${{ steps.version.outputs.version-name }}-release*.apk
        retention-days: 90

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download release APK
      uses: actions/download-artifact@v4
      with:
        name: release-apk
        path: ./apk/
        
    - name: Run APK security analysis
      uses: guardsquare/proguard-core-action@v1
      with:
        input: ./apk/CleverFerret-v${{ needs.build.outputs.version-name }}-release*.apk
        
    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.json

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, build, security-scan]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download release APK
      uses: actions/download-artifact@v4
      with:
        name: release-apk
        path: ./apk/
        
    - name: Download debug APK
      uses: actions/download-artifact@v4
      with:
        name: debug-apk
        path: ./apk/
        
    - name: Generate changelog
      id: changelog
      run: |
        # Generate changelog from git commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${LAST_TAG}..HEAD)
        else
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --max-count=10)
        fi
        
        # Save changelog to file
        cat > CHANGELOG.md << EOF
        # CleverFerret Universal Media Library v${{ needs.build.outputs.version-name }}
        
        ## What's New
        
        $CHANGELOG
        
        ## Installation
        
        1. Download the APK file below
        2. Enable "Install from Unknown Sources" in Android settings
        3. Install the APK on your Android device
        
        ## Features
        
        - Universal media library management (books, movies, music, podcasts)
        - Plex server integration with AI-powered metadata enhancement
        - Advanced e-reader with Moon+ Reader beating features
        - VLC-like video player with subtitle support
        - Smart content analysis and auto-labeling
        - 16+ metadata API integrations
        - Dark Plex-inspired UI theme
        
        ## System Requirements
        
        - Android 7.0 (API level 24) or higher
        - 100MB free storage space
        - Internet connection for metadata fetching
        EOF
        
        echo "changelog-file=CHANGELOG.md" >> $GITHUB_OUTPUT
        
    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: CleverFerret v${{ needs.build.outputs.version-name }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
        
    - name: Upload release APK to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./apk/CleverFerret-v${{ needs.build.outputs.version-name }}-release.apk
        asset_name: CleverFerret-v${{ needs.build.outputs.version-name }}-release.apk
        asset_content_type: application/vnd.android.package-archive
        
    - name: Upload debug APK to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./apk/CleverFerret-v${{ needs.build.outputs.version-name }}-debug.apk
        asset_name: CleverFerret-v${{ needs.build.outputs.version-name }}-debug.apk
        asset_content_type: application/vnd.android.package-archive

  publish-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Download release APK
      uses: actions/download-artifact@v4
      with:
        name: release-apk
        path: ./apk/
        
    - name: Publish to GitHub Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_USER: ${{ github.actor }}
      run: |
        # Configure Gradle for GitHub Packages
        ./gradlew publishToGitHub \
          -PgithubToken=$GITHUB_TOKEN \
          -PgithubUser=$GITHUB_USER \
          -PversionName=${{ needs.build.outputs.version-name }} \
          -PversionCode=${{ needs.build.outputs.version-code }}

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [test, build, release, publish-packages]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.build.result == 'success'
      run: |
        echo "✅ Build completed successfully!"
        echo "Version: ${{ needs.build.outputs.version-name }}"
        echo "Build artifacts are available in the Actions tab"
        
    - name: Notify failure
      if: needs.build.result == 'failure'
      run: |
        echo "❌ Build failed!"
        echo "Check the build logs for details"
        exit 1