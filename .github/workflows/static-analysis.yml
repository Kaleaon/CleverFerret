name: Code Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Normalize Android SDK environment variables
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "Using Android SDK at: $SDK_PATH"

      - name: Install required Android SDK packages
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;34.0.0" "platform-tools"
          echo "Installed SDK packages:"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list_installed

      - name: Check for raw console calls in app code
        run: ./scripts/check-no-raw-console.sh

      - name: Validate Android 14 widget background-update constraints
        run: ./scripts/ci/validate_android14_widget_background_updates.py

      - name: Validate markdown links and canonical status docs
        run: python3 scripts/ci/validate_docs_consistency.py

      - name: Run Android Lint
        run: ./gradlew lintDebug -Plint.abortOnError=true --no-daemon --stacktrace

      - name: Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: |
            CleverFerret/build/reports/lint-results-*.html
            CleverFerret/build/reports/lint-results-*.xml
            CleverFerret/build/reports/lint-results-*.txt
            CleverFerret/lint-baseline.xml

      - name: Comment Lint Results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const lintResultsPath = 'CleverFerret/build/reports/lint-results-debug.xml';
            if (fs.existsSync(lintResultsPath)) {
              const lintResults = fs.readFileSync(lintResultsPath, 'utf8');
              const issueCount = (lintResults.match(/<issue/g) || []).length;
              const body = `### 🔍 Lint Check Results\n\nFound ${issueCount} lint issues. Check the [artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4.4.7
