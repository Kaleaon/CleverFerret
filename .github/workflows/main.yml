name: Main CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  COMPILE_LOG: 'compile_output.txt'
  BUILD_LOG: 'build_output.txt'

permissions: {}

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPILE_LOG: compile_output_${{ github.sha }}_${{ github.run_attempt }}.txt

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: 11076708

    - name: Normalize Android SDK environment variables
      run: |
        SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
        echo "Using Android SDK at: $SDK_PATH"

    - name: Install required Android SDK packages
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;34.0.0" "platform-tools"
        echo "Installed SDK packages:"
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list_installed
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check for raw console calls in app code
      run: ./scripts/check-no-raw-console.sh

    - name: Validate Android 14 widget background-update constraints
      run: ./scripts/ci/validate_android14_widget_background_updates.py

    - name: Validate markdown links and canonical status docs
      run: python3 scripts/ci/validate_docs_consistency.py

    - name: Check docs local links
      run: ./scripts/ci/check_doc_links.py

    - name: Run Detekt and Android Lint
      run: ./gradlew detekt lintDebug -Plint.abortOnError=true --stacktrace

    - name: Enforce no accessibility lint issues
      run: python3 scripts/ci/check_accessibility_lint.py CleverFerret/build/reports/lint-results-debug.xml

    - name: Enforce Compose semantic token usage in feature UI
      run: |
        if [ -d "CleverFerretV2/feature" ]; then
          python3 scripts/ci/check_compose_semantic_tokens.py CleverFerretV2/feature
        fi

    - name: Validate V2 accessibility/theme contract tests
      run: |
        if [ -d "CleverFerretV2" ]; then
          ./gradlew -p CleverFerretV2 :core:ui:test --stacktrace
        fi

    - name: Run contrast + navigation contract tests
      run: |
        ./gradlew :CleverFerret:testDebugUnitTest \
          --tests com.universalmedialibrary.ui.media.theme.MediaAccessibilityContrastTest \
          --tests com.universalmedialibrary.ui.media.navigation.MediaNavDestinationsContractTest

    - name: Upload Quality & Lint Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: quality-gate-results
        path: |
          CleverFerret/build/reports/lint-results-*.html
          CleverFerret/build/reports/lint-results-*.xml
          CleverFerret/build/reports/lint-results-*.txt
          CleverFerret/lint-baseline.xml
          CleverFerret/detekt-baseline.xml
          CleverFerret/build/reports/detekt/

    - name: Comment Lint Results on PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs');
          const lintResultsPath = 'CleverFerret/build/reports/lint-results-debug.xml';
          if (fs.existsSync(lintResultsPath)) {
            const lintResults = fs.readFileSync(lintResultsPath, 'utf8');
            const issueCount = (lintResults.match(/<issue/g) || []).length;
            const body = `### 🔍 Quality Gate & Lint Check Results\n\nFound ${issueCount} lint issues. Check the [artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: 11076708

    - name: Normalize Android SDK environment variables
      run: |
        SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
        echo "Using Android SDK at: $SDK_PATH"

    - name: Install required Android SDK packages
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;34.0.0" "platform-tools"
        echo "Installed SDK packages:"
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list_installed
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: KSP gate (debug)
      run: |
        ./gradlew :CleverFerret:kspDebugKotlin --stacktrace --warning-mode all 2>&1 | tee ksp_output.txt

        if grep -q "error.NonExistentClass" ksp_output.txt; then
          echo "::error::KSP detected unresolved type error.NonExistentClass"
          exit 1
        fi

    - name: Compile project
      id: compile
      run: |
        # Run compilation with reduced verbosity for readable error output
        # Using --warning-mode all to show warnings without excessive info
        COMPILE_LOG="compile_output_${GITHUB_SHA:0:8}_${GITHUB_RUN_ATTEMPT}.txt"
        echo "COMPILE_LOG=$COMPILE_LOG" >> "$GITHUB_ENV"
        touch "$COMPILE_LOG"
        ./gradlew compileDebugKotlin --stacktrace --warning-mode all 2>&1 | tee "$COMPILE_LOG"
        exit_code=${PIPESTATUS[0]}

        if [ $exit_code -ne 0 ]; then
          echo ""
          echo "::group::Compilation Errors (last 200 lines)"
          tail -200 "$COMPILE_LOG"
          echo "::endgroup::"

          echo ""
          echo "::group::Error Summary"
          grep -E "^e: |error:|Error:|FAILURE:|BUILD FAILED" "$COMPILE_LOG" || echo "No specific error pattern found - check full output above"
          echo "::endgroup::"
        fi

        exit $exit_code

    - name: Report compilation results
      if: always()
      run: |
        if [ "${{ steps.compile.outcome }}" == "failure" ]; then
          echo "::error::Compilation failed. Check the 'Compilation Errors' section above for details."
          
          # Upload compile output as artifact for debugging if it exists
          if [ -n "${COMPILE_LOG:-}" ] && [ -f "$COMPILE_LOG" ]; then
            echo "Compilation log saved for debugging."
          fi
        elif [ "${{ steps.compile.outcome }}" == "success" ]; then
          echo "::notice::Compilation succeeded!"
        else
          echo "::warning::Compilation was skipped or cancelled."
        fi

    - name: Upload compilation log artifact
      if: always() && env.COMPILE_LOG != ''
      uses: actions/upload-artifact@v4
      with:
        name: compile-log-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ env.COMPILE_LOG || 'compile_output.txt' }}
        if-no-files-found: ignore

    - name: Run unit tests
      if: steps.compile.outcome == 'success'
      run: ./gradlew testDebugUnitTest
      id: unit-tests

    - name: Enforce critical-package coverage gates
      if: steps.compile.outcome == 'success' && steps.unit-tests.outcome == 'success'
      run: ./gradlew :CleverFerret:jacocoCriticalCoverageVerification --stacktrace
      id: coverage-gates

    - name: Report test results
      if: always()
      run: |
        if [ "${{ steps.unit-tests.outcome }}" == "failure" ]; then
          echo "::error::Unit tests failed. Check test reports for details."
        fi
        if [ "${{ steps.coverage-gates.outcome }}" == "failure" ]; then
          echo "::error::Coverage gates failed for critical packages."
        fi

    - name: Fail workflow if compilation or tests failed
      if: always()
      run: |
        if [ "${{ steps.compile.outcome }}" == "failure" ] || [ "${{ steps.unit-tests.outcome }}" == "failure" ] || [ "${{ steps.coverage-gates.outcome }}" == "failure" ]; then
          echo "Workflow failed due to compilation or test failures"
          exit 1
        fi

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: |
          CleverFerret/build/reports/tests/
          CleverFerret/build/reports/lint-results-debug.html
          CleverFerret/build/reports/lint-results-debug.xml
          CleverFerret/build/reports/lint-results-debug.txt
          CleverFerret/lint-baseline.xml
        if-no-files-found: ignore

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    if: always()  # Run even if test job fails to provide build diagnostics
    permissions:
      contents: read
      id-token: write # required for GitHub OIDC provenance attestations
    env:
      BUILD_LOG: build_output_${{ github.sha }}_${{ github.run_attempt }}.txt
    outputs:
      version-name: ${{ steps.version.outputs.version-name }}
      version-code: ${{ steps.version.outputs.version-code }}
      build-success: ${{ steps.build-debug.outcome == 'success' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: 11076708

    - name: Normalize Android SDK environment variables
      run: |
        SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
        echo "Using Android SDK at: $SDK_PATH"

    - name: Install required Android SDK packages
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;34.0.0" "platform-tools"
        echo "Installed SDK packages:"
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list_installed

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Extract version information
      id: version
      run: |
        VERSION_NAME=$(./gradlew -q printVersionName 2>/dev/null | tail -n1 || echo "1.0")
        VERSION_CODE=$(./gradlew -q printVersionCode 2>/dev/null | tail -n1 || echo "1")
        echo "version-name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version-code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "Version Name: $VERSION_NAME"
        echo "Version Code: $VERSION_CODE"
      continue-on-error: true

    - name: Build debug APK
      id: build-debug
      run: |
        echo "Building debug APK with debug reporting enabled..."
        # Run build with reduced verbosity for readable error output
        BUILD_LOG="build_output_${GITHUB_SHA:0:8}_${GITHUB_RUN_ATTEMPT}.txt"
        echo "BUILD_LOG=$BUILD_LOG" >> "$GITHUB_ENV"
        touch "$BUILD_LOG"
        ./gradlew assembleDebug --stacktrace --warning-mode all \
          -PDEBUG_REPORTING_ENABLED=true \
          -PCRASH_REPORTING_ENABLED=true \
          -PSHOW_DEBUG_MENU=true 2>&1 | tee "$BUILD_LOG"
        exit_code=${PIPESTATUS[0]}

        if [ $exit_code -ne 0 ]; then
          echo ""
          echo "::group::Build Errors (last 200 lines)"
          tail -200 "$BUILD_LOG"
          echo "::endgroup::"

          echo ""
          echo "::group::Error Summary"
          grep -E "^e: |error:|Error:|FAILURE:|BUILD FAILED" "$BUILD_LOG" || echo "No specific error pattern found - check full output above"
          echo "::endgroup::"
        fi

        exit $exit_code

    - name: Report build status
      if: always()
      run: |
        if [ "${{ steps.build-debug.outcome }}" == "failure" ]; then
          echo "::error::Debug APK build failed. Check the 'Build Errors' section above for details."
        else
          echo "::notice::Debug APK built successfully!"
          echo "Debug APK includes:"
          echo "  - Automated crash reporting"
          echo "  - Error logging"
          echo "  - Performance monitoring"
          echo "  - Debug menu access via Settings"
          echo "  - Feature flags"
        fi

    - name: Upload build log artifact
      if: always() && env.BUILD_LOG != ''
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ env.BUILD_LOG || 'build_output.txt' }}
        if-no-files-found: ignore
    - name: Build release APK
      if: steps.build-debug.outcome == 'success'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease
      
    - name: Verify release APK signature
      if: steps.build-debug.outcome == 'success'
      run: |
        echo "Verifying release APK signature with apksigner..."
        
        RELEASE_APK=""
        if [[ -f "CleverFerret/build/outputs/apk/release/CleverFerret-release.apk" ]]; then
          RELEASE_APK="CleverFerret/build/outputs/apk/release/CleverFerret-release.apk"
        elif [[ -f "CleverFerret/build/outputs/apk/release/CleverFerret-release-signed.apk" ]]; then
          RELEASE_APK="CleverFerret/build/outputs/apk/release/CleverFerret-release-signed.apk"
        else
          RELEASE_APK=$(find CleverFerret/build/outputs/apk/release/ -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
        fi

        if [[ -z "$RELEASE_APK" || ! -f "$RELEASE_APK" ]]; then
          echo "::error::Release APK file not found for signature verification!"
          exit 1
        fi

        echo "Found release APK: $RELEASE_APK"

        APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)
        if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
          APKSIGNER="apksigner"
        fi

        echo "Using apksigner at: $APKSIGNER"
        "$APKSIGNER" verify --verbose "$RELEASE_APK"
        
    - name: Rename APK files
      if: steps.build-debug.outcome == 'success'
      run: |
        VERSION_NAME="${{ steps.version.outputs.version-name }}"

        if [[ -f "CleverFerret/build/outputs/apk/debug/CleverFerret-debug.apk" ]]; then
          mv CleverFerret/build/outputs/apk/debug/CleverFerret-debug.apk \
             CleverFerret/build/outputs/apk/debug/CleverFerret-v${VERSION_NAME}-debug.apk
        fi

        if [[ -f "CleverFerret/build/outputs/apk/release/CleverFerret-release.apk" ]]; then
          mv CleverFerret/build/outputs/apk/release/CleverFerret-release.apk \
             CleverFerret/build/outputs/apk/release/CleverFerret-v${VERSION_NAME}-release.apk
        elif [[ -f "CleverFerret/build/outputs/apk/release/CleverFerret-release-signed.apk" ]]; then
          mv CleverFerret/build/outputs/apk/release/CleverFerret-release-signed.apk \
             CleverFerret/build/outputs/apk/release/CleverFerret-v${VERSION_NAME}-release.apk
        elif [[ -f "CleverFerret/build/outputs/apk/release/CleverFerret-release-unsigned.apk" ]]; then
          mv CleverFerret/build/outputs/apk/release/CleverFerret-release-unsigned.apk \
             CleverFerret/build/outputs/apk/release/CleverFerret-v${VERSION_NAME}-release-unsigned.apk
        fi

    - name: Generate checksums
      if: steps.build-debug.outcome == 'success'
      run: |
        VERSION_NAME="${{ steps.version.outputs.version-name }}"
        cd CleverFerret/build/outputs/apk

        if [[ -f "debug/CleverFerret-v${VERSION_NAME}-debug.apk" ]]; then
          sha256sum debug/CleverFerret-v${VERSION_NAME}-debug.apk > debug/CleverFerret-v${VERSION_NAME}-debug.apk.sha256
        fi

        if [[ -f "release/CleverFerret-v${VERSION_NAME}-release.apk" ]]; then
          sha256sum release/CleverFerret-v${VERSION_NAME}-release.apk > release/CleverFerret-v${VERSION_NAME}-release.apk.sha256
        elif [[ -f "release/CleverFerret-v${VERSION_NAME}-release-unsigned.apk" ]]; then
          sha256sum release/CleverFerret-v${VERSION_NAME}-release-unsigned.apk > release/CleverFerret-v${VERSION_NAME}-release-unsigned.apk.sha256
        fi

        # Generate combined checksum manifest
        find . -type f -name "*.apk" -exec sha256sum {} + > checksums.sha256
        
        # Display checksums in the workflow log
        echo "=== APK Checksums ==="
        cat debug/*.sha256 2>/dev/null || true
        cat release/*.sha256 2>/dev/null || true
        cat checksums.sha256 2>/dev/null || true

    - name: Upload debug APK
      if: steps.build-debug.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: |
          CleverFerret/build/outputs/apk/debug/CleverFerret-v${{ steps.version.outputs.version-name }}-debug.apk
          CleverFerret/build/outputs/apk/debug/*.sha256
        if-no-files-found: ignore

    - name: Upload release APK
      if: steps.build-debug.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: |
          CleverFerret/build/outputs/apk/release/CleverFerret-v${{ steps.version.outputs.version-name }}-release*.apk
          CleverFerret/build/outputs/apk/release/*.sha256
          CleverFerret/build/outputs/apk/checksums.sha256
        if-no-files-found: ignore

  clean-checkout-matrix:
    name: Clean checkout matrix
    runs-on: ubuntu-latest
    needs: quality-gate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [standard, refresh-deps]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: 11076708

    - name: Normalize Android SDK environment variables
      run: |
        SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
        echo "Using Android SDK at: $SDK_PATH"

    - name: Install required Android SDK packages
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;33.0.2" "platform-tools"

    - name: Cache Gradle packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean checkout dependency resolution
      run: |
        if [ "${{ matrix.scenario }}" = "refresh-deps" ]; then
          ./gradlew --no-daemon --refresh-dependencies :CleverFerret:dependencies
        else
          ./gradlew --no-daemon :CleverFerret:dependencies
        fi

    - name: Compile from clean checkout
      run: ./gradlew --no-daemon :CleverFerret:compileDebugKotlin

  publish-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.build-success == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        cache: 'gradle'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Publish to GitHub Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_USER: ${{ github.actor }}
      run: |
        ./gradlew publishToGitHub \
          -PgithubToken=$GITHUB_TOKEN \
          -PgithubUser=$GITHUB_USER \
          -PversionName=${{ needs.build.outputs.version-name }} \
          -PversionCode=${{ needs.build.outputs.version-code }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.build-success == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download all APKs
      uses: actions/download-artifact@v8
      with:
        path: apks

    - name: Attest Build Provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: 'apks/**/*.apk'

    - name: Generate release notes
      id: release_notes
      run: |
        VERSION="${{ needs.build.outputs.version-name }}"
        TAG_NAME="${GITHUB_REF#refs/tags/}"

        PREVIOUS_TAG=$(git describe --abbrev=0 --tags "${TAG_NAME}^" 2>/dev/null || echo "")
        if [ -n "$PREVIOUS_TAG" ]; then
          COMMITS=$(git log "${PREVIOUS_TAG}..${TAG_NAME}" --pretty=format:"- %s" --no-merges)
        else
          COMMITS=$(git log "${TAG_NAME}" --pretty=format:"- %s" --no-merges --max-count=20)
        fi

        DEBUG_CHECKSUM=""
        RELEASE_CHECKSUM=""

        if [[ -f "apks/debug-apk/CleverFerret-v${VERSION}-debug.apk.sha256" ]]; then
          DEBUG_CHECKSUM=$(cat "apks/debug-apk/CleverFerret-v${VERSION}-debug.apk.sha256" 2>/dev/null || echo "N/A")
        fi

        if [[ -f "apks/release-apk/CleverFerret-v${VERSION}-release.apk.sha256" ]]; then
          RELEASE_CHECKSUM=$(cat "apks/release-apk/CleverFerret-v${VERSION}-release.apk.sha256" 2>/dev/null || echo "N/A")
        elif [[ -f "apks/release-apk/CleverFerret-v${VERSION}-release-unsigned.apk.sha256" ]]; then
          RELEASE_CHECKSUM=$(cat "apks/release-apk/CleverFerret-v${VERSION}-release-unsigned.apk.sha256" 2>/dev/null || echo "N/A")
        fi

        cat > release_notes.md << EOF
        ## CleverFerret ${VERSION}

        ### 📱 System Requirements
        - Android 8.0+ (API level 26 or higher)
        - 100 MB free storage space

        ### 📦 Installation
        1. Download the APK below (release or debug version)
        2. Enable "Install from unknown sources" in Android settings if needed
        3. Install the APK
        4. See [Installation Guide](https://github.com/Kaleaon/CleverFerret/blob/main/docs/INSTALL.md) for detailed instructions

        ### 🎉 Changes in this Release
        ${COMMITS}

        ### 🔐 Checksums (SHA256)

        **Release APK:**
        ```
        ${RELEASE_CHECKSUM}
        ```

        **Debug APK:**
        ```
        ${DEBUG_CHECKSUM}
        ```

        ### 📝 Notes
        - Release APK is optimized with ProGuard/R8 for smaller size
        - Debug APK includes debugging symbols and is larger in size
        - Both versions are functionally equivalent

        For bug reports and feature requests, please visit the [Issues page](https://github.com/Kaleaon/CleverFerret/issues).
        EOF

        echo "release_body<<EOF" >> $GITHUB_OUTPUT
        cat release_notes.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v3
      with:
        name: CleverFerret ${{ needs.build.outputs.version-name }}
        body: ${{ steps.release_notes.outputs.release_body }}
        draft: false
        prerelease: false
        files: |
          ./apks/release-apk/CleverFerret-v${{ needs.build.outputs.version-name }}-release.apk
          ./apks/release-apk/CleverFerret-v${{ needs.build.outputs.version-name }}-release-unsigned.apk
          ./apks/debug-apk/CleverFerret-v${{ needs.build.outputs.version-name }}-debug.apk
          ./apks/release-apk/*.sha256
          ./apks/debug-apk/*.sha256
          ./apks/release-apk/checksums.sha256
        fail_on_unmatched_files: false
