name: Nightly Build

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  nightly-build:
    name: Nightly Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: '34.0.0'
        cmake-version: '3.22.1'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Generate nightly version
      id: version
      run: |
        DATE=$(date +'%Y%m%d')
        COMMIT_SHORT=$(git rev-parse --short HEAD)
        NIGHTLY_VERSION="nightly-${DATE}-${COMMIT_SHORT}"
        echo "nightly-version=$NIGHTLY_VERSION" >> $GITHUB_OUTPUT
        echo "Nightly version: $NIGHTLY_VERSION"
        
    - name: Build nightly APK
      run: |
        # Modify version for nightly build
        sed -i "s/versionName .*/versionName \"${{ steps.version.outputs.nightly-version }}\"/" CleverFerret/build.gradle.kts
        ./gradlew assembleDebug
        
    - name: Rename nightly APK
      run: |
        mv CleverFerret/build/outputs/apk/debug/CleverFerret-debug.apk \
           CleverFerret/build/outputs/apk/debug/CleverFerret-${{ steps.version.outputs.nightly-version }}.apk
           
    - name: Upload nightly APK
      uses: actions/upload-artifact@v4
      with:
        name: nightly-apk-${{ steps.version.outputs.nightly-version }}
        path: CleverFerret/build/outputs/apk/debug/CleverFerret-${{ steps.version.outputs.nightly-version }}.apk
        retention-days: 7
        
    - name: Create nightly release
      uses: actions/create-release@v1
      id: create_nightly_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.nightly-version }}
        release_name: CleverFerret Nightly ${{ steps.version.outputs.nightly-version }}
        body: |
          # CleverFerret Nightly Build
          
          **⚠️ This is a nightly development build and may be unstable.**
          
          - Build Date: $(date +'%Y-%m-%d %H:%M:%S UTC')
          - Commit: ${{ github.sha }}
          - Branch: main
          
          ## Installation
          
          1. Download the APK below
          2. Enable "Install from Unknown Sources" in Android settings
          3. Install the APK on your Android device
          
          ## Note
          
          Nightly builds are automatically deleted after 7 days.
          For stable releases, use the main releases page.
        draft: false
        prerelease: true
        
    - name: Upload nightly APK to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_nightly_release.outputs.upload_url }}
        asset_path: CleverFerret/build/outputs/apk/debug/CleverFerret-${{ steps.version.outputs.nightly-version }}.apk
        asset_name: CleverFerret-${{ steps.version.outputs.nightly-version }}.apk
        asset_content_type: application/vnd.android.package-archive
        
    - name: Clean old nightly releases
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Keep only the last 7 nightly releases
        gh release list --limit 100 | grep "nightly-" | tail -n +8 | while read line; do
          TAG=$(echo $line | awk '{print $1}')
          echo "Deleting old nightly release: $TAG"
          gh release delete $TAG --yes || true
        done