name: Auto bump Android versionCode (PR)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [ main, develop ]

permissions: {}

concurrency:
  group: auto-bump-version-code-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump:
    name: Bump versionCode if needed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Compute base/head version codes
        id: versions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF:$BASE_REF"
          BASE_CODE=$(python3 - <<'PY'
          import os, re, subprocess, sys
          base_ref = os.environ.get("BASE_REF", "")
          txt = subprocess.check_output(["git", "show", f"{base_ref}:CleverFerret/build.gradle.kts"], text=True)
          m = re.search(r"(?m)^\s*versionCode\s*=\s*(\d+)\s*$", txt)
          if not m: 
              print("0")
              sys.exit(0)
          print(m.group(1))
          PY
          )
          HEAD_CODE=$(python3 tooling/scripts/bump_version_code.py --file CleverFerret/build.gradle.kts)
          echo "base=$BASE_CODE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_CODE" >> "$GITHUB_OUTPUT"
          echo "Base versionCode: $BASE_CODE"
          echo "Head versionCode: $HEAD_CODE"

      - name: Bump versionCode to be > base
        id: bump
        env:
          BASE: ${{ steps.versions.outputs.base }}
          HEAD: ${{ steps.versions.outputs.head }}
        run: |
          set -euo pipefail
          if [ "$HEAD" -le "$BASE" ]; then
            NEW=$((BASE + 1))
            python3 tooling/scripts/bump_version_code.py --file CleverFerret/build.gradle.kts --set "$NEW"
            echo "new=$NEW" >> "$GITHUB_OUTPUT"
          else
            echo "No bump needed."
            echo "new=" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push (only if changed)
        if: ${{ steps.bump.outputs.new != '' }}
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CleverFerret/build.gradle.kts
          git commit -m "chore: bump versionCode to $NEW_VERSION"
          git push
