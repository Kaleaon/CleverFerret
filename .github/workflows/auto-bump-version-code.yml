name: Auto bump Android versionCode

# Bumping on pull requests made every open PR edit the same versionCode line,
# so each merge to main conflicted with all other open PRs. Bump once, on main.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: auto-bump-version-code
  cancel-in-progress: false

jobs:
  bump:
    name: Bump versionCode
    runs-on: ubuntu-latest
    # Skip commits made by this workflow itself to avoid a loop.
    if: ${{ github.actor != 'github-actions[bot]' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Bump versionCode
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(python3 tooling/scripts/bump_version_code.py --file CleverFerret/build.gradle.kts)
          NEW=$((CURRENT + 1))
          python3 tooling/scripts/bump_version_code.py --file CleverFerret/build.gradle.kts --set "$NEW"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit & push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CleverFerret/build.gradle.kts
          git commit -m "chore: bump versionCode to ${{ steps.bump.outputs.new }}"
          git push origin main
