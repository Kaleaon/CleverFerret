name: Generate Android Keystore (Manual Secrets)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias"
        required: true
        default: "cleverferret"
      cn:
        description: "Common Name (CN)"
        required: true
        default: "CleverFerret"
      ou:
        description: "Organizational Unit (OU)"
        required: false
        default: "Engineering"
      o:
        description: "Organization (O)"
        required: false
        default: "Kaleaon"
      l:
        description: "Locality/City (L)"
        required: false
        default: "Peoria"
      st:
        description: "State/Province (ST)"
        required: false
        default: "Illinois"
      c:
        description: "Country (C) - 2-letter code"
        required: true
        default: "US"
      validity:
        description: "Validity (days)"
        required: true
        default: "10000"
      keystore_password:
        description: "Keystore password (will be masked)"
        required: true
      key_password:
        description: "Key password (will be masked; can equal keystore password)"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ github.event.inputs.keystore_password }}"
          echo "::add-mask::${{ github.event.inputs.key_password }}"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity "${{ github.event.inputs.validity }}" \
            -alias "${{ github.event.inputs.key_alias }}" \
            -dname "CN=${{ github.event.inputs.cn }}, OU=${{ github.event.inputs.ou }}, O=${{ github.event.inputs.o }}, L=${{ github.event.inputs.l }}, ST=${{ github.event.inputs.st }}, C=${{ github.event.inputs.c }}" \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.key_password }}"

      - name: Base64 encode keystore
        run: base64 -w 0 release-keystore.jks > release-keystore.b64

      - name: Upload base64 keystore (short retention)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-b64
          path: release-keystore.b64
          retention-days: 1

      - name: Cleanup
        run: rm -f release-keystore.jks

      - name: Next steps
        run: |
          cat << 'EOM'
          Keystore generated. Download the 'release-keystore-b64' artifact from this run, then set the repository secrets manually:

          Secrets to add (Settings -> Secrets and variables -> Actions -> New repository secret):
          - ANDROID_KEYSTORE_BASE64      (contents of release-keystore.b64)
          - ANDROID_KEYSTORE_PASSWORD    (the value you entered)
          - ANDROID_KEY_ALIAS            (the value you entered)
          - ANDROID_KEY_PASSWORD         (the value you entered)

          Optionally, using GitHub CLI from your machine (with a logged-in admin/owner):
            gh secret set ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY" < release-keystore.b64
            printf "%s" "<keystore_password>" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" -f -
            printf "%s" "<key_alias>"         | gh secret set ANDROID_KEY_ALIAS        --repo "$GITHUB_REPOSITORY" -f -
            printf "%s" "<key_password>"      | gh secret set ANDROID_KEY_PASSWORD     --repo "$GITHUB_REPOSITORY" -f -

          After setting secrets, re-run "Android CI/CD".
          EOM
